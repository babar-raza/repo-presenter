name: present

# One repository, one durable transaction, run on hosted GitHub Actions runners in TWO jobs with a
# trust boundary between them. Dispatchable by hand here; a scheduled trigger is an owner decision
# (cadence and provider spend) not yet made.
#
#   facts   executes the upstream repository's own code (example builds: dotnet, javac, ...). It
#           references no secret, has a read-only token, installs the ecosystem toolchain, and can
#           only hand a facts.json plus a manifest to the next job.
#   present holds the provider key and the write-scoped state token. It installs no toolchain and
#           executes no repository code: it verifies and validates the facts artifact as hostile
#           input, re-clones the SAME pinned revision to read the README, then runs the chosen
#           lane(s), the review, the seal and the durable transaction.
#
# Two equal lanes (plans/PLAN_lane_l_hosted.md). Both read the one facts artifact. Lane R is the
# full reconstruction cascade; Lane L corrects the live README with minimal evidenced edits and has
# the FINAL README independently reviewed. "both" runs R then L in the present job, each as its own
# process: its own durable-state record, its own candidate pointer, its own seal. Lane L runs
# whether or not Lane R failed (neither lane is measured by the other's delivery); the job is red
# if either lane failed.
#
# tests/test_present.py parses this file and fails if the facts job gains a secret or write scope,
# or the present job gains a toolchain step; tests/test_present_lanes.py fails if a lane step is
# missing, runs the other lane's flag, or can be skipped because the other lane failed.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/name of a repository listed in data/registry.json"
        required: true
        type: string
      ecosystem:
        description: "platform plugin the repository is registered under"
        required: true
        type: choice
        options: [python, net, java, cpp, go, rust, typescript, nodejs]
      lane:
        description: "R: full reconstruction. L: correct the live README. both: R then L."
        required: true
        type: choice
        options: [both, R, L]
        default: both
  # 2026-11-04 (TC-012, follow-up directive §10): adding `schedule:` alone does NOT create a
  # valid portfolio schedule -- `inputs.*` is only populated for workflow_dispatch, so a naive
  # schedule trigger would launch a run with an empty repository/ecosystem and nothing to do.
  # The "Select this run's target" step in the facts job below resolves the real target for
  # either trigger; scheduled runs always run `lane: both` (inputs.lane is empty for a schedule
  # trigger, and the existing Lane R/L step conditions -- `inputs.lane != 'L'` /
  # `inputs.lane != 'R'` -- are both true on an empty string, which is the same as `both`, not a
  # new code path). Cadence is intentionally wide (owner can tighten after observing real cost
  # and failure rate): one target per run, at most once every 6 hours.
  # 2026-11-04 (P0 follow-up directive section 2): a scheduled run must fail closed until
  # scripts/scheduled_execution_gate.py's three independent predicates (explicit per-repository
  # authorization, the 2026-10-31 sweep pause actually lifted, reviewer calibration PASSED) all
  # hold. All three fail today, so this cron currently selects and spends nothing on every fire
  # -- a deliberate, evidenced no-op (see "Select this run's target" below), not a live schedule
  # waiting to be noticed.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # NOTE: concurrency groups are resolved at workflow-trigger time, before any job or step runs
  # -- `steps.*`/`needs.*` are not yet available here, only `inputs.*`/`github.*`. For a
  # workflow_dispatch this still gives real per-repository granularity. For a schedule trigger
  # `inputs.repository` is empty, so every scheduled run shares one group and queues serially --
  # a conservative, safe default (never two scheduled runs in flight at once), not a bug.
  group: present-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      facts_sha256: ${{ steps.digest.outputs.sha256 }}
      repository: ${{ steps.target.outputs.repository }}
      ecosystem: ${{ steps.target.outputs.ecosystem }}
      authorized: ${{ steps.target.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .

      # Resolves the real repository/ecosystem for EITHER trigger: a manual dispatch passes
      # them as inputs and IS its own explicit authorization (preserved exactly, unchanged). A
      # schedule trigger has no inputs at all and nobody is watching it start, so it goes
      # through scripts/scheduled_execution_gate.py instead -- the actual fail-closed boundary
      # (P0 follow-up directive section 2), not merely a cohort pick. The gate always exits 0 and
      # always emits authorized=true|false; every downstream step that would spend a provider
      # call or touch repository code is gated on that output, below and in the present job.
      - name: Select this run's target (authorization-gated for schedule, passthrough for manual dispatch)
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/scheduled_execution_gate.py --max 1 >> "$GITHUB_OUTPUT"
          else
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "repository=${{ inputs.repository }}" >> "$GITHUB_OUTPUT"
            echo "ecosystem=${{ inputs.ecosystem }}" >> "$GITHUB_OUTPUT"
          fi

      # Example verification compiles the README's own code against the product, so the SDK it
      # needs must exist on this runner; each toolchain is installed only for the ecosystem that
      # uses it. A runner without one still degrades to NOT_VERIFIED (never CONTRADICTED), but
      # without these steps every .NET and Java example would be unverifiable by construction.
      # The version is pinned because the receipt records it and a build is only as reproducible
      # as the toolchain that ran (10.0.204 is the SDK the verifier was measured against).
      - name: Install the .NET SDK for example compilation
        if: steps.target.outputs.authorized == 'true' && steps.target.outputs.ecosystem == 'net'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.204"

      - name: Install the JDK for example compilation
        if: steps.target.outputs.authorized == 'true' && steps.target.outputs.ecosystem == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # A floating "21" resolves to the latest available patch at request time, not a fixed
          # one: measured live (hosted runs 40635877718 and 40636304596, four minutes apart) as
          # 21.0.12.1 then 21.0.13, each embedded verbatim in every example's compiled-against
          # receipt (java_examples.py) -- so a Java candidate could never reach the no-op proof.
          # Pinned exactly, like the .NET SDK below.
          java-version: "21.0.12"

      - name: Build the facts
        if: steps.target.outputs.authorized == 'true'
        env:
          INPUT_REPOSITORY: ${{ steps.target.outputs.repository }}
          INPUT_ECOSYSTEM: ${{ steps.target.outputs.ecosystem }}
        run: |
          python -m repo_presenter.present \
            --stage facts \
            --repository "$INPUT_REPOSITORY" \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --workdir .present-work \
            --facts-dir .present-facts

      - name: Record the facts digest
        id: digest
        if: steps.target.outputs.authorized == 'true'
        run: echo "sha256=$(sha256sum .present-facts/facts.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Hand the facts to the present job
        if: steps.target.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: present-facts-${{ github.run_id }}
          path: .present-facts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  present:
    needs: facts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # contents: write only so the job's own token can write the durable-state refs
    # (refs/repository-presenter-state/*); it never pushes a branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .

      - name: Name this repository's persisted state
        id: slug
        env:
          INPUT_REPOSITORY: ${{ needs.facts.outputs.repository }}
        run: echo "slug=${INPUT_REPOSITORY//\//__}" >> "$GITHUB_OUTPUT"

      # A runner starts empty, so the previous run's sealed bundle and LLM call store are restored
      # here. Without them a rerun re-spends every provider call and can never reach the
      # zero-call byte-identical no-op proof. Both are content-addressed (a bundle is verified by
      # its manifest, a call by its request hash), so a stale or partial restore can only cost a
      # re-run, never a wrong proof; a cache miss degrades to a fresh seal.
      - name: Restore the previous sealed bundle and call store
        if: needs.facts.outputs.authorized == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            candidates/${{ steps.slug.outputs.slug }}
            .present-work/cascade/llm_cache
            .present-work/lane-l/llm_cache
          key: presenter-state-${{ steps.slug.outputs.slug }}-${{ github.run_id }}
          restore-keys: presenter-state-${{ steps.slug.outputs.slug }}-

      # The artifact is untrusted input from the job that ran repository code: the Present step
      # checks its manifest and digest (also against the digest the facts job published as a job
      # output), validates it as data, and re-clones the recorded revision for README reads only.
      # The facts job never uploads an artifact for an unauthorized scheduled run (gated above),
      # so this step must skip too, or a missing-artifact error would turn a deliberate no-op red.
      - name: Fetch the facts
        id: fetch_facts
        if: needs.facts.outputs.authorized == 'true'
        uses: actions/download-artifact@v4
        with:
          name: present-facts-${{ github.run_id }}
          path: .present-facts

      # Each lane is its own process, so its own durable-state record, candidate pointer and seal.
      # Lane L carries a status function (!cancelled()) so it runs whether or not Lane R failed:
      # neither lane is measured by the other's delivery. It still needs the facts, so it is gated
      # on the fetch step's outcome. The job is red if either lane is. `authorized == 'true'`
      # (an explicit positive match, not merely "not the literal string 'false'" -- a second
      # supervisor-directive correction: an absent, empty, or malformed output must also fail
      # closed, not just a well-formed "false") is the actual P0 enforcement point: the one
      # place a scheduled run's provider call and durable-state write are physically prevented
      # when unauthorized, not merely recorded as blocked in a taskcard.
      - name: Present (Lane R)
        if: ${{ needs.facts.outputs.authorized == 'true' && inputs.lane != 'L' }}
        env:
          INPUT_REPOSITORY: ${{ needs.facts.outputs.repository }}
          INPUT_ECOSYSTEM: ${{ needs.facts.outputs.ecosystem }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
          FACTS_SHA256: ${{ needs.facts.outputs.facts_sha256 }}
          GPT_OSS_ENDPOINT: ${{ secrets.GPT_OSS_ENDPOINT }}
          GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}
          # Stream replies: the gateway drops a non-streamed request at ~30 s (HTTP 502) while a
          # streamed one of the same length succeeds (measured 2026-11-04 and 2026-11-06).
          GPT_OSS_STREAMING: "1"
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          python -m repo_presenter.present \
            --stage cascade \
            --lane R \
            --repository "$INPUT_REPOSITORY" \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --state-remote "https://github.com/${GITHUB_REPOSITORY_SLUG}.git" \
            --workdir .present-work \
            --facts-dir .present-facts \
            --expected-facts-sha256 "$FACTS_SHA256"

      - name: Present (Lane L)
        if: ${{ !cancelled() && steps.fetch_facts.outcome == 'success' && inputs.lane != 'R' && needs.facts.outputs.authorized == 'true' }}
        env:
          INPUT_REPOSITORY: ${{ needs.facts.outputs.repository }}
          INPUT_ECOSYSTEM: ${{ needs.facts.outputs.ecosystem }}
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
          FACTS_SHA256: ${{ needs.facts.outputs.facts_sha256 }}
          GPT_OSS_ENDPOINT: ${{ secrets.GPT_OSS_ENDPOINT }}
          GPT_OSS_API_KEY: ${{ secrets.GPT_OSS_API_KEY }}
          # Stream replies: the gateway drops a non-streamed request at ~30 s (HTTP 502) while a
          # streamed one of the same length succeeds (measured 2026-11-04 and 2026-11-06).
          GPT_OSS_STREAMING: "1"
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          python -m repo_presenter.present \
            --stage cascade \
            --lane L \
            --repository "$INPUT_REPOSITORY" \
            --ecosystem "$INPUT_ECOSYSTEM" \
            --state-remote "https://github.com/${GITHUB_REPOSITORY_SLUG}.git" \
            --workdir .present-work \
            --facts-dir .present-facts \
            --expected-facts-sha256 "$FACTS_SHA256"

      - name: Save the sealed bundle and call store for the next run
        if: always() && needs.facts.outputs.authorized == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            candidates/${{ steps.slug.outputs.slug }}
            .present-work/cascade/llm_cache
            .present-work/lane-l/llm_cache
          key: presenter-state-${{ steps.slug.outputs.slug }}-${{ github.run_id }}

      - name: Keep the run's evidence
        if: always() && needs.facts.outputs.authorized == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: present-${{ needs.facts.outputs.ecosystem }}-${{ github.run_id }}
          path: |
            .present-work
            candidates/${{ steps.slug.outputs.slug }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
