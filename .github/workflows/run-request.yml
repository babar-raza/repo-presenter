name: run-request

# Owner ruling 2026-11-06 (docs/CONSOLIDATED_GOALS_2026-11-06.md, blocker 2): the supervisor session cannot
# dispatch workflows (HTTP 403) but can push. It starts a hosted run by pushing a branch
# `run-requests/<id>` whose only change from `main` is `run-request.json`.
#
# UNPRIVILEGED TRIGGER ONLY (trust redesign 2026-11-06, docs/DECISION_LOG.md). A push-triggered workflow runs
# this file as it exists on the PUSHED commit, so anyone who can push the branch can rewrite it: it must not
# be able to reach anything. It holds no secret, has a read-only token, checks nothing out, runs no
# repository code and does no validation that anything relies on. Its only effect is to complete, which
# fires `run-request-execute.yml` (workflow_run), which GitHub always runs from the default branch and which
# does every check with main's own code. tests/test_run_request.py fails if this file gains a secret or a
# write permission.

on:
  push:
    branches: ["run-requests/**"]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the request (data only; validated and executed by main's run-request-execute.yml)
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: printf 'run request %s at %s\n' "$REF" "$SHA"
