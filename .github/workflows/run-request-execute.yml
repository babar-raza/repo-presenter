name: run-request-execute

# The PRIVILEGED half of a run request (trust redesign 2026-11-06, docs/DECISION_LOG.md; owner ruling
# 2026-11-06, docs/CONSOLIDATED_GOALS_2026-11-06.md, blocker 2).
#
# `run-request.yml` (push to `run-requests/**`) holds no secret and only completes. This workflow runs on its
# `workflow_run` event, which GitHub always executes from the DEFAULT BRANCH's copy of this file: editing this
# file, run-request.yml or scripts/run_request.py on a request branch changes nothing that runs here.
#
#   validate  no secret, read-only token. Checks out `main` (never the request commit) and runs main's
#             scripts/run_request.py, which reads run-request.json from the triggering commit as DATA
#             (`git show <head_sha>:run-request.json`) and refuses: an unknown triggering workflow, a
#             non-push or non-success triggering run, a fork, a branch outside run-requests/, a head_sha that
#             is no longer the branch tip (replay), checked-out code that is not current main, a request
#             commit that is not exactly current main plus run-request.json, an unknown job, an unregistered
#             repository or wrong ecosystem, a bad lane, and a mint request with any other field.
#   present / mint  call the default-branch copies of the reusable workflows (local `./` paths resolve to this
#             run's commit, i.e. main) with `secrets: inherit`, only after validate passed.
#   audit-seed / audit-score / acceptance-write  the M9 round's override path (owner R37, 2026-11-13): the
#             same reusable workflows the scheduled audit-seed.yml chain calls. validate also refuses a seed
#             while an earlier batch is open, a seed_run_id that is not a completed, successful seed run of
#             this repository (GitHub API, read-only `actions: read` token), and any findings/adjudications
#             path but the exact committed file of that seed run. GITHUB_REF here is the default branch, so
#             the acceptance-audit environment's main-only rule and each workflow's main-only guard hold,
#             and the attestation is still signed by acceptance-write.yml@refs/heads/main.
#
# Residual risk (not closed here, see docs/DECISION_LOG.md): any account with push access can add a NEW
# workflow file on any branch and reach repository-level secrets; only moving the secrets to an Environment
# restricted to `main` closes that.
#
# tests/test_run_request.py parses this file and fails if the trigger stops being workflow_run of
# run-request, or the validate checkout uses the triggering head sha as its ref.

on:
  workflow_run:
    workflows: ["run-request"]
    types: [completed]
    branches: ["run-requests/**"]

permissions:
  contents: read

concurrency:
  group: run-request-execute-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # verify an M9 seed run through the API (read-only)
    outputs:
      job: ${{ steps.check.outputs.job }}
      repository: ${{ steps.check.outputs.repository }}
      ecosystem: ${{ steps.check.outputs.ecosystem }}
      lane: ${{ steps.check.outputs.lane }}
      seed_run_id: ${{ steps.check.outputs.seed_run_id }}
      findings_path: ${{ steps.check.outputs.findings_path }}
      findings_ref: ${{ steps.check.outputs.findings_ref }}
      adjudications_path: ${{ steps.check.outputs.adjudications_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate the request with main's validator (request read as data, never executed)
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_request.py --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  present:
    needs: validate
    if: needs.validate.outputs.job == 'present'
    permissions:
      contents: write  # present.yml's durable-state refs in this repository only
      # A called workflow's job permissions may not exceed the caller's, or GitHub refuses the whole
      # file at startup (startup_failure, 2026-11-13). present.yml's schedule-only `cohort` job holds
      # actions: write; it never runs here (event is workflow_run), but the ceiling must cover it.
      actions: write
    uses: ./.github/workflows/present.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      ecosystem: ${{ needs.validate.outputs.ecosystem }}
      lane: ${{ needs.validate.outputs.lane }}
    secrets: inherit

  mint:
    needs: validate
    if: needs.validate.outputs.job == 'mint'
    permissions:
      contents: write  # the mint workflow pushes its proof branch in this repository only
    uses: ./.github/workflows/tc-009a-mint-proof.yml
    secrets: inherit

  recertify:
    needs: validate
    if: needs.validate.outputs.job == 'recertify'
    permissions:
      contents: write  # recertify writes new seal commits to this repository's state refs only
    uses: ./.github/workflows/recertify.yml

  audit-seed:
    needs: validate
    if: needs.validate.outputs.job == 'audit-seed'
    permissions:
      contents: write       # the seed, findings, attempt, scorecard and record bot branches
      actions: read         # artifacts of the seed run
      id-token: write       # the nested acceptance-write attestation (Sigstore)
      attestations: write
    uses: ./.github/workflows/audit-seed.yml
    secrets: inherit

  audit-score:
    needs: validate
    if: needs.validate.outputs.job == 'audit-score'
    permissions:
      contents: write  # the scorecard's own bot branch
      actions: read    # the seed run's manifest artifact
    uses: ./.github/workflows/audit-score.yml
    with:
      seed_run_id: ${{ needs.validate.outputs.seed_run_id }}
      findings_path: ${{ needs.validate.outputs.findings_path }}
      findings_ref: ${{ needs.validate.outputs.findings_ref }}
    secrets: inherit

  acceptance-write:
    needs: validate
    if: needs.validate.outputs.job == 'acceptance-write'
    permissions:
      contents: write       # the record's own bot branch
      id-token: write       # Sigstore signing for the attestation
      attestations: write
      actions: read         # the seed run's artifacts
    uses: ./.github/workflows/acceptance-write.yml
    with:
      seed_run_id: ${{ needs.validate.outputs.seed_run_id }}
      findings_path: ${{ needs.validate.outputs.findings_path }}
      findings_ref: ${{ needs.validate.outputs.findings_ref }}
      adjudications_path: ${{ needs.validate.outputs.adjudications_path }}
    secrets: inherit
