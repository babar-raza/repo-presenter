name: run-request-execute

# The PRIVILEGED half of a run request (trust redesign 2026-11-06, docs/DECISION_LOG.md; owner ruling
# 2026-11-06, docs/CONSOLIDATED_GOALS_2026-11-06.md, blocker 2).
#
# `run-request.yml` (push to `run-requests/**`) holds no secret and only completes. This workflow runs on its
# `workflow_run` event, which GitHub always executes from the DEFAULT BRANCH's copy of this file: editing this
# file, run-request.yml or scripts/run_request.py on a request branch changes nothing that runs here.
#
#   validate  no secret, read-only token. Checks out `main` (never the request commit) and runs main's
#             scripts/run_request.py, which reads run-request.json from the triggering commit as DATA
#             (`git show <head_sha>:run-request.json`) and refuses: an unknown triggering workflow, a
#             non-push or non-success triggering run, a fork, a branch outside run-requests/, a head_sha that
#             is no longer the branch tip (replay), checked-out code that is not current main, a request
#             commit that is not exactly current main plus run-request.json, an unknown job, an unregistered
#             repository or wrong ecosystem, a bad lane, and a mint request with any other field.
#   cohort    the engine's override (owner R37, 2026-11-13): present.yml called with NO target runs only
#             its cohort job -- the same authorization-gated planner the hourly schedule and
#             cohort-chain.yml run, under the same one-planner group -- for when the cron is late.
#   issues    calls issues.yml (owner R39, 2026-11-13): one maintenance cycle for every pilot repository (a
#             matrix leg each: 3D TypeScript and, since R50 2026-11-22, TeX Python in dry run), no input.

#   monitor   calls monitor.yml (owner R50, 2026-11-22; WP-3): one read-only drift / discovery / freshness
#             pass over the portfolio, report to refs/repository-presenter-state/monitor/report. No input.
#   count     (BL-111, 2026-11-14) runs main's ops/checks/portfolio_delivery_count.py hosted, with
#             attestations: read so each acceptance record's Sigstore attestation verifies, and writes the
#             official per-lane delivered count to the job summary. Read-only: no secret, no write scope.
#   propose   (R50, WP-1) calls propose.yml for one sealed candidate: a DRY RUN by default (payload built and uploaded,
#             nothing written); `"dry_run": false` only asks for propose.yml's write job, which runs solely behind its
#             own gates (allowlist, registry full, owner kill-switch variable, R15 portfolio predicate, sandbox target
#             variable). validate fixes every field; the request carries no token, branch, title or path.
#             `"sandbox": true` (R17, owner decision 2026-11-22) sends the candidate to the sandbox repository the
#             variable names instead (draft PR under sandbox/, see propose.yml); it never widens any other gate.
#   present / mint  call the default-branch copies of the reusable workflows (local `./` paths resolve to this
#             run's commit, i.e. main) with `secrets: inherit`, only after validate passed.
#   bridge    (BL-770) one zero-call DRY RUN of scripts/supervisor_bridge.py: what the planner says is due, the
#             ledger's leases and the exact run-request.json the supervisor-tick bridge would dispatch. Read-only.
#   metadata-audit  (BL-772) calls metadata-audit.yml: the read-only metadata audit of every active repository.
#   audit-seed / audit-score / acceptance-write  the M9 round's override path (owner R37, 2026-11-13): the
#             same reusable workflows the scheduled audit-seed.yml chain calls. validate also refuses a seed
#             while an earlier batch is open, a seed_run_id that is not a completed, successful seed run of
#             this repository (GitHub API, read-only `actions: read` token), and any findings/adjudications
#             path but the exact committed file of that seed run. GITHUB_REF here is the default branch, so
#             the acceptance-audit environment's main-only rule and each workflow's main-only guard hold,
#             and the attestation is still signed by acceptance-write.yml@refs/heads/main.
#   review-page / feedback-intake  (BL-760/761, R47) call review-page.yml (rebuild + host the README Candidate
#             Review page) and feedback-intake.yml (open review-feedback issues -> backlog items); no input, no secret.
#   audit-settle  (BL-160) records a past M9 audit round's measured provider spend, from its own
#             m9-audit-ledger artifact, as one idempotent settle entry on the provider-spend ledger. No secret.
#   audit-abandon (BL-163) ends a seed batch the gate reports blocked (MAX_AUDIT_ATTEMPTS attempts, no frozen
#             findings) by pushing audit-abandoned/run-<id> at main. validate refuses a batch with findings or
#             with fewer attempts. Nothing is accepted; no secret.
#
# Residual risk (not closed here, see docs/DECISION_LOG.md): any account with push access can add a NEW
# workflow file on any branch and reach repository-level secrets; only moving the secrets to an Environment
# restricted to `main` closes that.
#
# tests/test_run_request.py parses this file and fails if the trigger stops being workflow_run of
# run-request, or the validate checkout uses the triggering head sha as its ref.

on:
  workflow_run:
    workflows: ["run-request"]
    types: [completed]
    branches: ["run-requests/**"]

permissions:
  contents: read

concurrency:
  group: run-request-execute-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # verify an M9 seed run through the API (read-only)
    outputs:
      job: ${{ steps.check.outputs.job }}
      repository: ${{ steps.check.outputs.repository }}
      ecosystem: ${{ steps.check.outputs.ecosystem }}
      lane: ${{ steps.check.outputs.lane }}
      refresh: ${{ steps.check.outputs.refresh }}
      dry_run: ${{ steps.check.outputs.dry_run }}
      sandbox: ${{ steps.check.outputs.sandbox }}
      seed_run_id: ${{ steps.check.outputs.seed_run_id }}
      findings_path: ${{ steps.check.outputs.findings_path }}
      findings_ref: ${{ steps.check.outputs.findings_ref }}
      adjudications_path: ${{ steps.check.outputs.adjudications_path }}
      audit_run_id: ${{ steps.check.outputs.audit_run_id }}
      batch: ${{ steps.check.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate the request with main's validator (request read as data, never executed)
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/run_request.py --event "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"

  present:
    needs: validate
    if: needs.validate.outputs.job == 'present'
    permissions:
      contents: write  # present.yml's durable-state refs in this repository only
      # A called workflow's job permissions may not exceed the caller's, or GitHub refuses the whole
      # file at startup (startup_failure, 2026-11-13). present.yml's schedule-only `cohort` job holds
      # actions: write; it never runs here (event is workflow_run), but the ceiling must cover it.
      actions: write
    uses: ./.github/workflows/present.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      ecosystem: ${{ needs.validate.outputs.ecosystem }}
      lane: ${{ needs.validate.outputs.lane }}
      refresh: ${{ needs.validate.outputs.refresh == 'true' }}
    secrets: inherit

  cohort:
    needs: validate
    if: needs.validate.outputs.job == 'cohort'
    permissions:
      contents: write  # the provider-spend ledger ref (present.yml's cohort job)
      actions: write   # the cohort job dispatches present.yml runs
    # No target and no secret: only present.yml's cohort job runs (it holds no secret).
    uses: ./.github/workflows/present.yml

  count:
    needs: validate
    if: needs.validate.outputs.job == 'count'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read      # main's code and the state refs, read-only
      attestations: read  # gh attestation verify of each acceptance record
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0  # as supervisor-tick.yml's count, which this mirrors
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Count delivered candidates per lane (official count, attestations verified)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          set +e
          timeout 35m python ops/checks/portfolio_delivery_count.py --per-lane 25 > "$RUNNER_TEMP/count.txt" 2>&1
          rc=$?
          set -e
          {
            echo "## Delivered count (run-request count)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/count.txt"
            echo '```'
            echo "exit code: $rc"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/count.txt"
          # Exit 1 means only that the --per-lane 25 gate does not hold yet; the count itself is the result.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then exit "$rc"; fi

  bridge:
    needs: validate
    if: needs.validate.outputs.job == 'bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Dry run of the execution bridge (zero provider calls, nothing dispatched)
        env:
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bridge"
          python scripts/supervisor_bridge.py --dry-run --remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            --out "$RUNNER_TEMP/bridge/decision.json" 2> "$RUNNER_TEMP/bridge/decision.txt"
          {
            echo "## Execution bridge dry run (run-request bridge)"
            echo '```'
            cat "$RUNNER_TEMP/bridge/decision.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/bridge/decision.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-decision
          path: ${{ runner.temp }}/bridge/decision.json
          if-no-files-found: ignore

  metadata-audit:
    needs: validate
    if: needs.validate.outputs.job == 'metadata-audit'
    permissions:
      contents: read
    uses: ./.github/workflows/metadata-audit.yml

  # BL-760/761 (R47, WP-6): rebuild and host the review page; sweep open review-feedback issues into backlog
  # items. Both are fixed workflows on main with no input.
  review-page:
    needs: validate
    if: needs.validate.outputs.job == 'review-page'
    permissions:
      contents: write  # the review-page branch of this repository only
      pages: write     # used only when the REVIEW_PAGE_PAGES variable opts in
      id-token: write
      attestations: read  # review-page.yml's build job verifies each acceptance record's attestation (as the count job)
    uses: ./.github/workflows/review-page.yml

  feedback-intake:
    needs: validate
    if: needs.validate.outputs.job == 'feedback-intake'
    permissions:
      contents: write       # the feedback-intake/run-<id> branch
      issues: write         # one comment per filed issue
      pull-requests: write
    uses: ./.github/workflows/feedback-intake.yml

  mint:
    needs: validate
    if: needs.validate.outputs.job == 'mint'
    permissions:
      contents: write  # the mint workflow pushes its proof branch in this repository only
    uses: ./.github/workflows/tc-009a-mint-proof.yml
    secrets: inherit

  recertify:
    needs: validate
    if: needs.validate.outputs.job == 'recertify'
    permissions:
      contents: write  # recertify writes new seal commits to this repository's state refs only
    uses: ./.github/workflows/recertify.yml

  issues:
    needs: validate
    if: needs.validate.outputs.job == 'issues'
    permissions:
      contents: write  # issues.yml's state ref in this repository only; upstream writes use the App token
    uses: ./.github/workflows/issues.yml
    secrets: inherit

  propose:
    needs: validate
    if: needs.validate.outputs.job == 'propose'
    permissions:
      contents: read      # no write scope here: upstream writes use the App token minted inside propose.yml's write job
      attestations: read  # propose.yml's gate and write jobs verify the acceptance records for the R15 predicate
    uses: ./.github/workflows/propose.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      lane: ${{ needs.validate.outputs.lane }}
      dry_run: ${{ needs.validate.outputs.dry_run != 'false' }}
      # R17 sandbox mode only when the request wrote `"sandbox": true`; anything else is the normal path
      sandbox: ${{ needs.validate.outputs.sandbox == 'true' }}
    secrets: inherit

  monitor:
    needs: validate
    if: needs.validate.outputs.job == 'monitor'
    permissions:
      contents: write  # monitor.yml's state ref in this repository only; upstream is read, never written
    uses: ./.github/workflows/monitor.yml

  audit-seed:
    needs: validate
    if: needs.validate.outputs.job == 'audit-seed'
    permissions:
      contents: write       # the seed, findings, attempt, scorecard and record bot branches
      actions: read         # artifacts of the seed run
      id-token: write       # the nested acceptance-write attestation (Sigstore)
      attestations: write
    uses: ./.github/workflows/audit-seed.yml
    secrets: inherit

  audit-score:
    needs: validate
    if: needs.validate.outputs.job == 'audit-score'
    permissions:
      contents: write  # the scorecard's own bot branch
      actions: read    # the seed run's manifest artifact
    uses: ./.github/workflows/audit-score.yml
    with:
      seed_run_id: ${{ needs.validate.outputs.seed_run_id }}
      findings_path: ${{ needs.validate.outputs.findings_path }}
      findings_ref: ${{ needs.validate.outputs.findings_ref }}
    secrets: inherit

  acceptance-write:
    needs: validate
    if: needs.validate.outputs.job == 'acceptance-write'
    permissions:
      contents: write       # the record's own bot branch
      id-token: write       # Sigstore signing for the attestation
      attestations: write
      actions: read         # the seed run's artifacts
    uses: ./.github/workflows/acceptance-write.yml
    with:
      seed_run_id: ${{ needs.validate.outputs.seed_run_id }}
      findings_path: ${{ needs.validate.outputs.findings_path }}
      findings_ref: ${{ needs.validate.outputs.findings_ref }}
      adjudications_path: ${{ needs.validate.outputs.adjudications_path }}
    secrets: inherit

  # BL-160: record one past M9 audit round's measured provider spend on the durable provider-spend ledger
  # (a round that ran before the audit reserved from it; first: 2026-11-14, seed 43620199171, audit run
  # 43641838293, which spent ~420 calls against a checkout's committed budget file). It downloads only that
  # round's call ledger and the seed's public case index -- never the manifest, no secret, no environment.
  # The settle id is keyed to the audit run, so a repeated request is a no-op.
  audit-settle:
    needs: validate
    if: needs.validate.outputs.job == 'audit-settle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the provider-spend ledger ref only
      actions: read    # the audit run's ledger artifact and the seed run's case index
    env:
      SEED: ${{ needs.validate.outputs.seed_run_id }}
      AUDIT_RUN: ${{ needs.validate.outputs.audit_run_id }}
      BATCH: ${{ needs.validate.outputs.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Download the audit round's call ledger
        uses: actions/download-artifact@v4
        with:
          name: m9-audit-ledger-${{ needs.validate.outputs.seed_run_id }}-${{ needs.validate.outputs.audit_run_id }}
          path: ${{ runner.temp }}/m9-audit-spend
          run-id: ${{ needs.validate.outputs.audit_run_id }}
          github-token: ${{ github.token }}
      - name: Download the seed's public case index (never the manifest)
        uses: actions/download-artifact@v4
        with:
          name: m9-seed-candidates-${{ needs.validate.outputs.seed_run_id }}
          path: ${{ runner.temp }}/m9-audit-in
          run-id: ${{ needs.validate.outputs.seed_run_id }}
          github-token: ${{ github.token }}
      - name: Settle the round's measured spend on the durable ledger
        env:
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          cases=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))))" "$RUNNER_TEMP/m9-audit-in/case_index.json")
          python -m repo_presenter.core.llm.budget settle --purpose audit --cases "$cases" \
            --remote "https://github.com/${{ github.repository }}.git" \
            --id "audit-${SEED}-${AUDIT_RUN}" --repository m9-audit --batch "$BATCH" \
            --workdir "$RUNNER_TEMP/m9-audit-spend" \
            --call-ledger "$RUNNER_TEMP/m9-audit-spend/ledger.jsonl" \
            --run-id "$AUDIT_RUN" --main-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${AUDIT_RUN}"
          python -m repo_presenter.core.llm.budget status \
            --remote "https://github.com/${{ github.repository }}.git" >> "$GITHUB_STEP_SUMMARY"

  # BL-163: end a seed batch the gate reports `blocked` (no frozen findings after MAX_AUDIT_ATTEMPTS hosted
  # attempts), so it stops holding every later round (first: seed 43620199171, 2026-11-15). validate has
  # already refused a batch with findings or fewer attempts. No secret, no environment, nothing accepted.
  audit-abandon:
    needs: validate
    if: needs.validate.outputs.job == 'audit-abandon'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the audit-abandoned/run-<id> branch only
    env:
      SEED: ${{ needs.validate.outputs.seed_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark the blocked seed batch abandoned
        run: |
          git push origin "HEAD:refs/heads/audit-abandoned/run-${SEED}"
          echo "seed batch ${SEED} abandoned at main ${GITHUB_SHA} (BL-163): its candidates stay unjudged" >> "$GITHUB_STEP_SUMMARY"
