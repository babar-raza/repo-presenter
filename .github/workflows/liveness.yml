name: liveness

# Out-of-band liveness dead-man (BL-771, WP-7), ported from the old project's `liveness.yml`
# (PHASE1/F2, 2026-09-11; manifest entry "liveness dead-man" in migration/reuse-manifest.yaml).
#
# Why: every supervision mechanism ran inside one place, and when that place died nothing noticed (the old
# project: 4.5 days). Here the engine is the scheduled `present` cohort heartbeat and the hourly
# `supervisor-tick`; GitHub documents that scheduled runs are silently deprioritized under load (measured
# on this repository: ticks 5 to 9 hours apart). This workflow is the second, independent observer: it has
# its own cron, and it also chains off every completed tick and present run, so it rides the traffic that
# starves the cron.
#
# It DETECTS and fails loudly; it repairs nothing, holds no secret and has read-only scopes. Red means only:
#   * the observer is blind (the run listing or the git refs cannot be read), or
#   * the supervisor-tick has no successful run for DEAD_AFTER_HOURS (the dead-man proper), or
#   * main has gone quiet during a declared sprint (plans/sprint/ACTIVE exists).
# A tick older than WARN_AFTER_HOURS and stale open PRs / stranded branches are OBSERVATIONS (::notice::),
# never failures, so the list stays visible while the run stays green (the old project's 2026-10-04 lesson).

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["supervisor-tick", "present"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: liveness
  cancel-in-progress: true

env:
  WARN_AFTER_HOURS: "3"
  DEAD_AFTER_HOURS: "12"

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dead-man -- the supervisor-tick and the engine heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed listing is a liveness failure (the observer is blind). Parsing is in python.
          set -euo pipefail
          for wf in supervisor-tick.yml present.yml; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?status=success&per_page=1" > "$RUNNER_TEMP/${wf}.json"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import datetime as dt
          import json
          import os
          import sys

          warn_h = float(os.environ["WARN_AFTER_HOURS"])
          dead_h = float(os.environ["DEAD_AFTER_HOURS"])
          now = dt.datetime.now(dt.timezone.utc)
          lines = ["### Liveness (dead-man)"]
          failed = False
          for wf, dead_man in (("supervisor-tick.yml", True), ("present.yml", False)):
              runs = json.load(open(os.path.join(sys.argv[1], wf + ".json"))).get("workflow_runs", [])
              if not runs:
                  lines.append(f"- `{wf}`: no successful run on record")
                  failed = failed or dead_man
                  continue
              ended = dt.datetime.fromisoformat(runs[0]["updated_at"].replace("Z", "+00:00"))
              age_h = (now - ended).total_seconds() / 3600
              status = "ok"
              if age_h >= dead_h and dead_man:
                  status = "DEAD"
                  failed = True
                  print(f"::error title=Dead-man::{wf} has had no successful run for {age_h:.1f} h (limit {dead_h:g} h)")
              elif age_h >= warn_h:
                  status = "stale"
                  print(f"::notice title=Stale heartbeat::{wf} last succeeded {age_h:.1f} h ago (notice at {warn_h:g} h)")
              lines.append(f"- `{wf}`: last success {age_h:.1f} h ago, run {runs[0]['id']} -- {status}")
          text = "\n".join(lines)
          print(text)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as out:
              out.write(text + "\n")
          sys.exit(1 if failed else 0)
          PY

      - name: Observe open PRs older than 30 minutes (label-independent; notice, not failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          listing=$(gh pr list --state open --limit 200 --json number,createdAt,labels,headRefName)
          python3 - "$listing" <<'PY'
          import datetime as dt
          import json
          import os
          import sys

          prs = json.loads(sys.argv[1])
          now = dt.datetime.now(dt.timezone.utc)
          rows = []
          for pr in prs:
              created = dt.datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
              age_min = int((now - created).total_seconds() // 60)
              if age_min <= 30:
                  continue
              labels = {label["name"] for label in pr.get("labels", [])}
              branch = pr["headRefName"]
              if "hold" in labels:
                  status = "held (label hold)"
              else:
                  status = "stale: adopt or close"
                  print(f"::notice title=Stale open PR::PR #{pr['number']} ({branch}) is {age_min} min old with no 'hold' label")
              rows.append(f"| #{pr['number']} | `{branch}` | {age_min} | {status} |")
          lines = ["### Open PRs older than 30 minutes",
                   f"{len(prs)} open PR(s); {len(rows)} older than 30 minutes (observation only)."]
          if rows:
              lines += ["", "| PR | branch | age (min) | status |", "|---|---|---|---|"] + rows
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Observe remote branches ahead of main and untouched for 12+ hours (notice, not failure)
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          refs=$(git for-each-ref refs/remotes/origin --format '%(refname:short)')
          stranded=0
          while read -r ref; do
            case "$ref" in origin/main|origin/HEAD|"") continue ;; esac
            ahead=$(git rev-list --count "origin/main..$ref")
            [ "$ahead" -gt 0 ] || continue
            tip_age_h=$(( (now - $(git log -1 --format=%ct "$ref")) / 3600 ))
            if [ "$tip_age_h" -ge 12 ]; then
              echo "::notice title=Stranded remote branch::branch $ref is $ahead commit(s) ahead of main and untouched for ${tip_age_h}h"
              stranded=$((stranded + 1))
            fi
          done <<< "$refs"
          line="$stranded remote branch(es) ahead of main and untouched for 12+ hours (observation only)."
          echo "$line"
          printf '\n### Stranded remote branches\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Main inactivity while a sprint is active
        run: |
          # plans/sprint/ACTIVE exists only during a declared sprint; outside one, a quiet main is normal.
          test -f plans/sprint/ACTIVE || { echo "no active sprint; inactivity check skipped"; exit 0; }
          age_h=$(( ( $(date -u +%s) - $(git log -1 --format=%ct origin/main) ) / 3600 ))
          if [ "$age_h" -ge 4 ]; then
            echo "::error::main has been inactive ${age_h}h during an active sprint -- the engine and the supervisor may both be down"
            exit 1
          fi
          echo "main last moved ${age_h}h ago -- within the active-sprint threshold"
