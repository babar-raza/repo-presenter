name: cohort-chain

# The self-continuing half of the autonomous engine (owner ruling R37, 2026-11-13: the loop runs
# itself on GitHub Actions; it must not depend on cron punctuality -- present.yml's hourly schedule
# went unfired for hours here). present.yml's `schedule` stays as the heartbeat that restarts an
# idle loop; this workflow plans the next cohort the moment work finishes:
#
#   * a present run the planner dispatched (a workflow_dispatch run of present.yml) completes, or
#   * an M9 round completes (audit-seed, or a standalone acceptance-write, which closes the batch);
#   * a portfolio re-certification completes (recertify.yml, which runs on every push to main that
#     changes the pipeline -- owner ruling R41, backlog BL-060): every cell that no longer certifies
#     under the fixed code is what the planner selects, so this queues them for re-production. A
#     recertify run called by run-request-execute.yml is that workflow's run, not recertify's, and
#     does not chain (the supervisor's run-request `cohort` is its override).
#
# It runs only present.yml's cohort job (a call with no target), from the default branch (a
# workflow_run run always executes main's copy of this file, and the call resolves to main's
# present.yml). Bounded by construction:
#
#   * one planner at a time: the cohort job's own concurrency group, shared with the heartbeat and
#     the run-request `cohort` override;
#   * one cohort at a time: while any cell an earlier planner dispatched is still in flight, the
#     planner holds and dispatches nothing (scripts/select_scheduled_cohort.py, `held`), so only the
#     completion of a cohort's LAST run dispatches the next one -- a chain never fans out;
#   * an idle portfolio ends the chain: nothing needs work (or no budget / stop rule) -> nothing is
#     dispatched -> no present run completes -> this workflow is not triggered again. Its own
#     completion is not one of its triggers, and present.yml's schedule fires (planner-only runs)
#     are filtered out below, so a chain link never triggers itself.
#
# No secret is passed: the cohort job holds none (the facts/present jobs do not run on a
# no-target call). tests/test_cohort_chain.py parses this file.

on:
  # Requested by present.yml's `chain` job when a planner-dispatched run finishes (BL-077): those
  # runs are created with GITHUB_TOKEN, so their completion never fires workflow_run below.
  workflow_dispatch:
  workflow_run:
    workflows: ["present", "audit-seed", "acceptance-write", "recertify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  cohort:
    # A present run counts only when it was a dispatched worker run; a schedule fire of present.yml
    # is itself a planner run and must not re-trigger the planner.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.name != 'present' || github.event.workflow_run.event == 'workflow_dispatch')
    permissions:
      contents: write  # the provider-spend ledger ref only (present.yml's cohort job)
      actions: write   # dispatch present.yml runs
    uses: ./.github/workflows/present.yml
