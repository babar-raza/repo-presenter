name: metadata-audit

# BL-772 (WP-9, owner R50): the read-only repository metadata audit -- description, topics, license,
# community files and visual assets of every active registry repository, observed with GET requests only
# (src/repo_presenter/monitor/metadata_audit.py; the observation half of the old project's
# components/metadata/). It has NO write path: contents are read-only, no secret is referenced, and the only
# outputs are the job summary and the `metadata-audit-report` artifact (JSON and markdown). Applying any
# metadata upstream is a separate owner-gated step (R3, R15, R22) that this workflow never performs.
#
# Weekly schedule, manual dispatch, and a run-request `metadata-audit` (run-request-execute.yml calls it).

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: metadata-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .

      - name: Audit every active repository (reads only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m repo_presenter.monitor.metadata_audit --out-dir "$RUNNER_TEMP/metadata-audit" > "$RUNNER_TEMP/audit.txt" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/audit.txt"
          cat "$RUNNER_TEMP/metadata-audit/metadata-audit.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-audit-report
          path: ${{ runner.temp }}/metadata-audit/
          if-no-files-found: ignore
          retention-days: 90
