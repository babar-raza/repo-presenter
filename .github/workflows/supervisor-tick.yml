name: supervisor-tick

# 2026-11-06 (owner ruling R8, docs/CONSOLIDATED_GOALS_2026-11-06.md): the scheduled liveness /
# continuation signal for the gate state machine. Read-only by construction: it runs
# `gatecli.py doctor`, `tick` and `worker-tick --dry-run` (which reports whether the leased
# card has new card-tagged commits awaiting independent verification, whether the lease has
# expired, and which READY card would be dispatched next) and writes the result to the job
# summary. It never writes the instructions channel, never pushes, never verifies (verification
# mutates receipts and belongs to the supervisor session), and uses no secrets (only the automatic read-only workflow token). Real dispatch to
# cloud sessions is done by the supervisor session acting on this signal.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The delivery counter verifies each acceptance record's Sigstore attestation
  # (`gh attestation verify`) and reads the live README for the R16 no-op check; both need the
  # automatic workflow token. Without it every record read as unattested and the count was 0.
  attestations: read

concurrency:
  group: supervisor-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0   # worker-tick looks for card-tagged commits since the lease base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the gate's own dependencies
        run: python -m pip install pyyaml jsonschema && python -m pip install -e .

      - name: doctor / tick / worker-tick --dry-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Read-only here (contents: read): fetches the failure refs for the Pareto below.
          REPOSITORY_PRESENTER_STATE_TOKEN: ${{ github.token }}
        run: |
          status=0
          {
            echo "## Supervisor tick ($(date -u +%Y-%m-%dT%H:%M:%SZ), ${GITHUB_SHA:0:12})"
            # Owner ruling R11: every report leads with delivery numbers (accepted per lane, delivered).
            echo
            echo "### Delivery"
            echo '```'
            set +e
            python ops/checks/portfolio_delivery_count.py --per-lane 25 2>&1 | tail -20
            set -e
            echo '```'
            echo
            # R40 (owner, 2026-11-13): silently dropped work is the failure mode -- every tick shows what is next,
            # what has gone stale and what is untracked, right after the delivery numbers.
            echo "### Backlog"
            echo '```'
            set +e
            python ops/checks/backlog_check.py --report 2>&1 | tail -30
            set -e
            echo '```'
            echo
            # BL-084 (owner, 2026-11-13): every hosted failure is classified at its source; the
            # portfolio Pareto of each cell's latest record says which class to fix first (R36b).
            echo "### Failure classes"
            echo
            set +e
            python -m repo_presenter.failures pareto --remote "https://github.com/${GITHUB_REPOSITORY}.git" --limit 15 2>&1 | tail -25
            set -e
            for cmd in "doctor" "tick" "worker-tick --dry-run --holder supervisor"; do
              echo
              echo "### gatecli.py $cmd"
              echo '```'
              set +e
              # shellcheck disable=SC2086
              python ops/gatecli.py $cmd 2>&1
              rc=$?
              set -e
              echo '```'
              echo "exit code: $rc"
              if [ "$rc" -ne 0 ]; then status=1; fi
            done
            exit "$status"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # bash -eo pipefail (the Actions default): a nonzero group exit fails this step.

      - name: The tick wrote nothing (read-only guarantee)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
