name: ci

# 2026-11-04 (follow-up directive §13): minimal release CI -- enforce the existing test suite on
# every push/PR against main, so a release-critical change cannot merge with failing checks.
# Deliberately NOT an extensive packaging/infra project: no SBOM, no multi-OS matrix, no
# publishing step -- exactly the directive's own "keep this minimal" instruction. Toolchain
# checks the hosted present.yml also needs (dotnet/java) are NOT installed here on purpose:
# this CI validates the Python package and its own test suite, not every ecosystem's example
# compilation, which present.yml's own facts job already covers per-dispatch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Validate taskcard governance (schema, dependency graph, dashboard sync)
        run: python ops/gatecli.py validate

  # 2026-11-06 (owner rule: a version bump never invalidates a seal; repo_presenter.recertify):
  # the no-regression merge gate. Every bundle ref's latest seal is re-certified under the PR's
  # code (zero provider calls, read-only: no ref is written) and compared with the committed
  # data/recertification_baseline.json. A seal that re-certified on the base branch and does not
  # now fails the job, unless the PR's baseline records it NEEDS_REPAIR with a justification that
  # names each newly failing check.
  recertification-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .

      - name: The base branch's baseline (the gate's "before")
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:data/recertification_baseline.json" > "$RUNNER_TEMP/base_baseline.json" \
            || rm -f "$RUNNER_TEMP/base_baseline.json"

      - name: Re-certify every latest seal and compare with the baseline
        env:
          # read-only: git fetches refs/repository-presenter-state/bundles/* with this token
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          base=()
          if [ -f "$RUNNER_TEMP/base_baseline.json" ]; then
            base=(--base-baseline "$RUNNER_TEMP/base_baseline.json")
          fi
          python -m repo_presenter.recertify --gate \
            --remote "https://github.com/${REPOSITORY_SLUG}.git" "${base[@]}"

  # 2026-11-04 (G6): the facts-stage image had never been built. Building it here is the hosted,
  # authorized verification of the Dockerfile (README.md copy, git install) -- the cloud sandbox
  # cannot reach the Debian mirrors, so this job, not a local build, is the evidence.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the facts-stage image
        run: docker build -t repo-presenter-facts .

      - name: The image has git (the facts stage clones with it) and runs unprivileged
        run: |
          docker run --rm --network=none --entrypoint git repo-presenter-facts --version
          test "$(docker run --rm --network=none --entrypoint id repo-presenter-facts -u)" = "10001"

      - name: The entrypoint starts with no network
        run: docker run --rm --network=none repo-presenter-facts --help

      - name: No secret-shaped variable is baked into the image
        run: |
          docker run --rm --network=none --entrypoint env repo-presenter-facts \
            | grep -i -E '(token|secret|password|api_key|GPT_OSS)' && exit 1 || true

      - name: With no network the facts stage fails closed (it resolves and clones its own revision)
        run: |
          set +e
          out="$(docker run --rm --network=none repo-presenter-facts \
            --repository aspose-words-foss/Aspose.Words-FOSS-for-Python --ecosystem python \
            --workdir /tmp/work --facts-dir /tmp/facts 2>&1)"
          rc=$?
          echo "$out"
          test "$rc" = "3"
          echo "$out" | grep -q "cannot resolve the default-branch revision"

      # TC-021: the step above only proves the fail-closed path (no network). Until now, no facts
      # stage had ever executed inside this container against a real network at all. This step is
      # the working-path counterpart: real network, real clone, real extraction -- no secret of
      # any kind, same as every other step in this job.
      - name: With network allowed the facts stage actually clones and extracts a real public repository
        run: |
          mkdir -p "$RUNNER_TEMP/facts-proof"
          docker run --rm -v "$RUNNER_TEMP/facts-proof:/tmp/facts" repo-presenter-facts \
            --repository aspose-words-foss/Aspose.Words-FOSS-for-Python --ecosystem python \
            --workdir /tmp/work --facts-dir /tmp/facts
          test -s "$RUNNER_TEMP/facts-proof/facts.json"
