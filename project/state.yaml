  - id: BUILD_FORMAT_DETECTION_FOR_NON_PYTHON_ECOSYSTEMS
    status: DONE
    priority: high
    purpose: >
      DONE 2026-10-22. The single biggest "lanes don't yet work equally" gap found in this
      session. All 6 non-Python ecosystems (.NET, Java, C++, Go, Rust, TypeScript) now have a
      real, independently-investigated format-declarations reader.
    done_net: >
      DONE 2026-10-22, clean (zero false positives after one found-and-fixed): new
      extractors/platforms/net_format_declarations.py (class-declaration + dispatch-switch
      reading, verified directly against aspose-3d-foss/.NET's real IOService.cs: finds
      exactly its real 8 registered formats, correctly finds none for U3D/RVM/AMF/HTML5) +
      format_overclaim.py extended with a second, bounded claim source (Mermaid At a Glance
      i\d+/o\d+ node labels, not general prose parsing). Real end-to-end result: all 4 known
      over-claimed formats (U3D, RVM, AMF, HTML5) caught automatically, at every node they
      appear in, plus a correct complementary under-claim finding (COLLADA registered and
      working but never mentioned). One real false positive found and fixed along the way
      (AVEVA/PDMS, a vendor+product-suite name mistaken for format names) with a regression
      test. 912/912 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-3d-foss__Aspose.3D-FOSS-for-.NET/.
    done_java: >
      DONE 2026-10-22, clean (zero false positives after one found-and-fixed): new
      extractors/platforms/java_format_declarations.py. Different idiom than .NET's, confirmed
      by reading the real source first (FileFormat.java, IOService.java): Java's dispatch chain
      tests the raw extension string literal directly (`ext.equals("stl")`) inside
      load/save/createLoadOptions/createSaveOptions methods, never a format identifier the way
      .NET's switch does -- so declaration and registration are correlated by extension string,
      not by name. Also found and worked around a real wrinkle the .NET reader didn't have:
      every declared FileFormat hardcodes canImport/canExport true regardless of whether any
      dispatch arm reaches it, so those booleans are noise, not a usable signal. Real end-to-end
      result: this repository's live README does not over-claim (only claims STL, which really
      is registered); the real, measured gap is the opposite direction -- report_gaps correctly
      finds GLB registered-but-unmentioned. Honest limitation surfaced and stated, not hidden:
      GLB's dispatch arm exists but its handler (GltfReader.load/GltfWriter.save) is itself an
      unimplemented TODO stub -- "a dispatch arm matches" is not the same as "the matched code
      actually works," and this reader cannot tell the two apart (recorded as a known
      limitation, not silently papered over). One real false positive found and fixed
      (ASCII, a content-encoding qualifier of the adjacent STL claim, mistaken for a second
      format name) with a regression test. 917/917 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-3d-foss__Aspose.3D-FOSS-for-Java/.
    done_cpp: >
      DONE 2026-10-22, against aspose-cells-foss/Aspose.Cells-FOSS-for-Cpp (the only mode:full
      cpp registry entry). A third, again-different idiom: no extension string literal exists
      anywhere in source, just a plain enum class LoadFormat/SaveFormat, so the reader
      normalizes the enumerator name itself (Xlsx -> .xlsx) -- a stated heuristic, not a literal
      read. One real bug found and fixed before any result could be trusted: this repository's
      own Workbook.h forward-declares the enum (`enum class SaveFormat;`, no body) before using
      it in method signatures, and the first regex version's `[^{]*` gap skipped past that
      semicolon and greedily matched the next unrelated brace block, reading ordinary method
      parameter names as five garbage "declared formats" -- fixed (`[^{;]*`) with a regression
      test. Real end-to-end result: this repository's declared and registered surfaces are
      already consistent -- no over-claim, no under-claim for format at all (output.xlsx
      SUPPORTED, matching the live README's one real claim). Honest limitation surfaced, not
      hidden: input.xlsx comes out UNRESOLVED even though loading obviously works, because the
      real source never writes a qualified `LoadFormat::Xlsx` reference anywhere (only
      `LoadFormat::Auto` is referenced) -- the mirror image of Java's dispatched-but-stub gap:
      there a signal fired for something that doesn't work, here something that works produces
      no signal. 924/924 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-cells-foss__Aspose.Cells-FOSS-for-Cpp/.
    done_go: >
      DONE 2026-10-22, against aspose-cells-foss/Aspose.Cells-FOSS-for-Go (the only mode:full
      go registry entry). A fourth, again-different idiom, and the first where the two-source
      design itself does not transfer: Go has no format enum, no class hierarchy, no string-
      literal constructor argument anywhere -- format support is expressed purely through
      exported identifiers (ExportToCSV/ImportFromCSV, the format name a literal suffix of the
      Go identifier) and, for the primary bare Load/Save, through English prose in the doc
      comment directly above them (no format name in the identifier at all). Stated honestly:
      an exported Go function's mere existence already implies the code compiles, so this
      reader has no second, independent signal to corroborate against the way .NET/Java/C++'s
      declared-vs-dispatch splits do -- confirmed directly by searching this repository's real
      source for any TODO/stub marker near a format identifier and finding none. Both
      "declaration" and "registration" are therefore emitted from the same single reading, by
      design, not as a shortcut. Real end-to-end result: all 4 claimed formats
      (input/output csv, input/output xlsx) come out SUPPORTED, matching the live README
      exactly -- plus two unrelated, independently real Lane L findings proving the whole
      pipeline is live for Go: two real structure fixes auto-applied (a stray second H1, an
      unclosed <details> block), and a real compiler-caught broken example
      (`undefined: generateSmallPNG`). 930/930 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-cells-foss__Aspose.Cells-FOSS-for-Go/.
    done_rust: >
      DONE 2026-10-22, against aspose-cells-foss/Aspose.Cells-FOSS-for-Rust (the only rust
      registry entry, dry_run mode). Structurally close to the C++ reader -- a plain enum
      LoadFormat/SaveFormat with no extension literal, qualified-reference registration -- but
      independently investigated, not assumed to generalize. Two real differences confirmed:
      Rust enums cannot be forward-declared without a body (the C++ reader's forward-decl false
      positive has no Rust counterpart to guard against), and Rust's exhaustiveness checking
      means a match over an enum must name every variant to compile, so this repository's real
      gate functions name LoadFormat::Auto AND LoadFormat::Xlsx explicitly -- unlike C++'s
      sibling finding, both directions corroborate for Xlsx here. Real end-to-end result: both
      input.xlsx and output.xlsx SUPPORTED, matching the live README's one claim, zero findings
      of any kind in this run. 935/935 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-cells-foss__Aspose.Cells-FOSS-for-Rust/.
    done_typescript: >
      DONE 2026-10-22, against aspose-cells-foss/Aspose.Cells-FOSS-for-TypeScript (the only
      mode:full typescript registry entry). A sixth idiom -- a string-valued SaveFormat enum
      (member value IS the extension, like Java's constructor-argument literal) plus a
      detectFormat() helper that references every member without performing any I/O. A naive
      reader treating any SaveFormat.X reference anywhere as "registered" would have been
      fooled by detectFormat() into falsely corroborating CSV/JSON/MARKDOWN -- this reader is
      scoped to read qualified references only from inside save()'s/load()'s own body. This
      investigation surfaced a REAL latent bug in the product's own code (not the README):
      save() special-cases only SaveFormat.HTML and silently writes XLSX/ZIP bytes for
      CSV/JSON/MARKDOWN paths too, despite declaring and detecting them -- confirmed the live
      README is careful enough to document CSV/JSON/MARKDOWN only via the separate, genuinely-
      working toCsv()/toJson()/toMarkdown() text methods, never via save(), so no README
      over-claim exists to flag; the product bug itself is out of this tool's scope to fix.
      One real bug caught and fixed in this reader before it could be trusted: the first
      version's fixed-size line window (the .NET/Java readers' approach) measurably bled past
      save()'s real end into the unrelated detectFormat() method on a dense fixture, which
      would have hidden exactly the gap this reader exists to catch -- replaced with real
      paren/brace-depth counting before any result was trusted. Real end-to-end result: only
      input.html/output.html SUPPORTED, matching the live README's one direct claim, zero
      findings of any kind. 940/940 whole-repo tests pass. Evidence:
      evidence/build/P2_REAL_ENGINE_SALVAGE/aspose-cells-foss__Aspose.Cells-FOSS-for-TypeScript/.
    summary: >
      All six non-Python ecosystems now have a real format-declarations reader, each
      independently investigated against that ecosystem's own live source, never assumed from
      another reader's shape. The correlation key diverged across all six: .NET (identifier via
      dispatch-arm), Java (extension string), C++/Rust (identifier via qualified enum
      reference, with Rust's exhaustiveness checking changing which direction corroborates), Go
      (no second signal at all -- the two-source design itself did not transfer), TypeScript
      (a signal that exists but must be scoped to the right method body, not any reference in
      the tree). Across the six, real bugs were found and fixed in the readers themselves
      before being trusted (the .NET/Java readers' assumptions, the C++ forward-declaration
      false positive, the TypeScript window-overflow false corroboration), and real findings
      were surfaced in the live repositories measured: .NET's U3D/RVM/AMF/HTML5 over-claim,
      Java's GLB dispatched-but-stub gap, Go's real compiler-caught broken example, and
      TypeScript's real save()-vs-declared-formats product bug (correctly not a README defect).
  - id: WRITE_PROMPTS_FOR_AUTHORING
