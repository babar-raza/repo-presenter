      bundle/manifest/seal file layout (core/candidates.py, data/readme_standard/*.yaml
      archetypes) this repository has NONE of.
      (2) review.py is where the real fold-bug lived, and it is a 2,996-line, 21-version,
      heavily production-hardened module -- its own header comment is a changelog of 21
      separate, measured false-positive/false-negative fixes found live against real
      repositories over roughly six weeks of the old project's history, not a single clean
      design. The DETERMINISTIC_RULES/JUDGMENT_RULES split (the one pattern worth carrying
      forward) is version "19" of 21, built ON TOP OF a web of other machinery this repository
      does not have: repair/rounds.py (the repair loop a reviewer's findings feed into -- this
      repository has no repair loop at all, so a reviewer's REJECT findings currently have
      nowhere to go), components/shell.py's exact chrome strings and renderer.py's exact
      rendered output shape (several checks match literal renderer-emitted text, which will not
      line up with this repository's own, independently adapted renderer without re-deriving
      each match point), and FACT_KINDS/defect_fingerprint from repair/targeted.py (not ported).
      A verbatim port would almost certainly misfire against this repository's different
      pipeline shapes; a from-scratch build needs the claim-grounding layer
      (validation/claims.py/deferrals.py, still PENDING_REVIEW per this file's own inventory
      entry) read first to avoid re-deriving grounding logic that already exists, proven,
      elsewhere.
      CORRECTED PRIORITY NOTE: this remains the right next large undertaking (Gate A genuinely
      needs it), but it is multi-session-scale work, comparable to the already-correctly-
      deferred 11,364-line validation/review/repair subsystem named in
      CLOSE_DUPLICATE_OPENING_PARAGRAPH_PARTIAL -- not a tweak, and not safely startable without
      first deciding where a reviewer's REJECT findings go (this repository has no repair loop
      to hand them to) and reading validation/claims.py+deferrals.py first.
    purpose: >
      Close the single largest gap SALVAGE_INVENTORY_2026_10_23 found: this repository has no
      independent non-authoring reviewer at all. Mission Gate A requires one; every candidate
      accepted so far (36/36 Lane L, 31/36 Lane R) rests on deterministic checks + supervisor
      judgment only.
    objective: >
      Build this repository's OWN independent reviewer against the DETERMINISTIC_RULES/
      JUDGMENT_RULES split pattern migration/reuse-manifest.yaml's entry #1 already specifies
      (deterministic rules may refute with refuted_by{rule,evidence}; judgment rules annotate
      only, never fold a REJECT to ACCEPT) -- NOT a port of the old repo's review.py/judge.py,
      which are disqualified from REUSE by the Oct 20 owner-confirmed blind spot
      (docs/MISSION_AUTHORITY.md's "critical fact": pre-2026-10-10, 27/30 real REJECT findings
      were wrongly folded to ACCEPT whenever a finding's quoted span matched a literal SUPPORTED
      fact value).
    write_paths: [src/repo_presenter/readme/review/independent_reviewer.py,
      tests/readme/review/test_independent_reviewer.py]
    test_command: python -m pytest tests/readme/review -q
    falsifier: >
      Feed the reviewer a candidate with one deliberately false claim whose quoted span happens
      to also match a literal SUPPORTED fact value elsewhere in the candidate (the exact negative
      control the old bug would have failed); assert the verdict is REJECT, not ACCEPT. A change
      that reintroduces the old fold-to-ACCEPT behavior must make this test fail.
    source_refs: >
      migration/reuse-manifest.yaml entry #1 ("components/readme/review/independent/
      review.py (reviewer verdict-fold logic)"); docs/MISSION_AUTHORITY.md's "critical fact"
      section; the new "review/independent/review.py + acceptance/judge.py + review/acceptance/*"
      entry appended to migration/reuse-manifest.yaml 2026-10-23.
    rollback: delete the new file and its test; no other module depends on it yet (ADD, not
      ADAPT -- nothing to revert elsewhere).
    next_step: >
      Before writing independent_reviewer.py: (1) read validation/claims.py (690 lines) and
      deferrals.py (905 lines) from the old repo -- the claim-grounding logic a reviewer's
      factuality checks need, separate from this card's own object; (2) decide where this
      repository hands a REJECT finding, given it has no repair/rounds.py-equivalent loop yet
