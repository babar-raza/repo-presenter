  - id: BUILD_INDEPENDENT_REVIEWER
    status: BLOCKED_NEEDS_SCOPING
    priority: highest
    scoping_read_2026_10_23: >
      Read judge.py (740 lines) and the first ~220 lines of review.py (2,996 lines) in full
      before writing any code, per this card's own discipline. CORRECTING this card's own
      earlier framing: this is NOT a bounded, single-file build. Findings:
