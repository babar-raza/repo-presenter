active_work_item:
  id: P2_GENERALIZE_AND_HARDEN
  status: READY
  purpose: >
    Mission section 12, P2: generalize by failure class, not anecdote. With portfolio breadth
    now proven (36/36), the next work is depth and automation, not more repositories:
    (1) turn the manual/agent-driven composition process into a deterministic, repeatable
    tool (src/repo_presenter/ currently only has the issues/github/authorization slice --
    facts-extraction, Lane L correction, Lane R composition, and the independent reviewer
    exist only as this session's own reasoning, not as code); (2) wire gateverify.py to
    actually re-run/no-op-prove portfolio candidates; (3) find or construct a genuinely
    weak/missing-README repository to test real Lane R divergence (falsify the convergence
    pattern seen in all 36 repos so far); (4) add the Enterprise Edition naming check to the
    standard fact checklist; (5) decide, with the owner, which of the 5 remaining drafted/
    findable upstream issues to file next.
  prerequisites:
    - P1_PORTFOLIO_SCALE accepted (DONE)

