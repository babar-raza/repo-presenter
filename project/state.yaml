      reading any of the code, that git_safety/{hooks,neuter}.py "defuse" a cloned repository's
      own git hooks. Read all five files in full this tick: that hypothesis is WRONG, and in any
      case not a meaningful git attack surface (`git clone` never transfers the remote's
      server-side hooks into the local .git/hooks/, so there was nothing to defuse). The real,
      confirmed mechanism: clone_pinned() makes a clone provably PUSH-SAFE (neuters the push URL,
