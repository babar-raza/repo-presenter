  - id: INDEPENDENT_LLM_REVIEWER
    status: PLANNED
    priority: highest
    authority: plans/PLAN_independent_llm_reviewer.md (design); mission sections 7.7 and 11
    purpose: >
      Close the largest mission gap. Today only deterministic rules can block; an LLM judgment can never
      veto, the inverse of mission section 7 step 7 ("a returned reviewer REJECT is blocking unless an
      explicit, proven deterministic refutation resolves each finding"). Evidence it matters: hosted runs
      accepted a capability unit containing "full round-trip fidelity", which no fact supports.
    decisions_taken_2026_10_27: >
      Taken by the supervisor under the owner's delegation ("you are in the best position to decide"),
      replacing the three questions earlier left open: (1) the fold changes -- LLM findings block by
      default and clear only through a closed catalogue of deterministic clearances (plan D1-D5); (2) the
      reviewer routes to gpt-oss, a different model from the author, SUBJECT to the calibration gate
      (plan D6/D9); a failed gate keeps qwen3-next as a recorded, visible exception, never silently;
      (3) live calibration calls are authorised within a stated budget of about 170 calls, hard cap 250.
    phases:
      - id: P1_CORE
        status: PENDING
        exit: finding status/clearance model, closed clearance catalogue, single fold, verdict v2, contract validation; scripted tests V1-V3 pass.
      - id: P2_JOB
        status: PENDING
        exit: packet builder, prompt v15 (claim_kind, no advisory tier), run_job wiring, cascade stage S10, repair routing, present.py gate; scripted end to end.
      - id: P3_CALIBRATION
        status: PENDING
        exit: forest corpus + mutation operators + metrics harness; always-ACCEPT and always-REJECT stubs fail the gate; live pilot within budget; recall/FP/stability numbers recorded in docs/.
    progress_2026_10_27: >
      P1_CORE built (c82152a), P2_JOB built (25d1c97), P3 calibration iteration 1 RAN (f2e8537, 9393206;
      165 live calls; docs/investigations/2026-10-27-independent-reviewer-calibration.md) and the gate
      FAILED for both models: recall 0.00-0.40 per class against a 0.90 target, 54% of gpt-oss reviews
      unavailable, stability 0.20. Reported as measured; no rule, clearance or threshold was loosened.
      Pipeline-shaped causes found: (1) D4 demanded a product-fact citation for unsupported_claim, which
      by definition has none (24 of 27 contract errors) -- a defect in the plan itself; (2) gpt-oss returns
      empty content on the re-ask in 26 of 27 cases; (3) max_output_tokens 6000 truncates a reasoning model
      (2 of 99); (4) quote fidelity. The reviewer is NOT enabled for any cohort or PR decision until the
      gate passes. Real value shown: gpt-oss caught a genuine README-vs-inherited-unit contradiction
      ("exposes Render" vs "rendering not implemented") that no deterministic rule saw and that
      qwen3-next accepted.
    owner_decision_model_2026_10_27: >
      BINDING, from the owner: qwen3-next is the ONLY model; gpt-oss is eliminated totally. This
      overrides plan D6(a) (a reviewer on a different model from the author). Consequence recorded
      honestly: author and reviewer now share a model, so independence rests on a separate job id,
      prompt and ledger attribution, the evidence-only packet, the deterministic holdouts that depend
      on no model, and the calibration gate -- not on model diversity. Known risk: iteration-1
      qwen3-next measurements were poor on precision (false-reject 0.67 on 3 clean twins; findings
      mostly preference/renderer layout) and it ACCEPTed a candidate containing a real contradiction
      that gpt-oss caught; the calibration gate for qwen3-next is therefore the open question, and the
      cure is prompt/contract/packet work and more deterministic holdouts, never a loosened rule.
      Env var names GPT_OSS_* are the gateway credential names, not the model, and are unchanged.
    calibration_iteration_2_2026_10_27: >
      qwen3-next only, 121 live calls (1c4922b; docs/investigations/2026-10-27-reviewer-calibration-iteration-2.md).
      Gate still FAILS: contradiction recall 0.36, content loss 0.00, unsupported claim 0.25, broken install
      0.50 (reviewer ALONE; content loss and install are 6/6 at pipeline level through the deterministic
      stage), false-reject on clean twins 0.33 (1 of 3; the rejected one is a known-flawed baseline, the two
      vetted twins were 0/2). Passes: JSON-valid first reply 1.00, stability 0.90 (weak evidence: 6 of 10
      cases ACCEPTed all three times). Contract-valid first reply 0.36 -> 0.68; unavailable 0.46 -> 0.20.
      Root causes: ~70k-token whole-document packets dilute a mid-size model (it ACCEPTs 27 of 41 defective
      candidates); unsupported_claim is 87 percent of findings, many aimed at renderer-printed text and 29
      repeated within one reply; the 12-line cap caused 8 of 13 rejected first replies.
    gate_semantics_decision_2026_10_27: >
      DECISION (supervisor, recorded so the goalposts are visibly not moved): the mission's veto is a
      PIPELINE property, so the gate is two-tier and BOTH numbers are always reported. (1) Pipeline coverage:
      every defect class needs >= 0.90 recall from the deterministic stage plus the reviewer combined;
      classes decidable by code (version, package, format, install claims, content loss, duplication) must be
      carried by deterministic checks, with the reviewer-alone number reported but not gated. (2) LLM-only
      classes (unsupported prose claims, subtle contradiction with inherited text, quality) keep the 0.90
      recall TARGET; if the best measured qwen3-next result is lower, the product records its measured recall in
      every verdict and PR eligibility requires an explicit owner acceptance of those declared limits
      (reviewer_calibration_status PASSED_WITH_DECLARED_LIMITS is settable only by a committed owner file,
      never by code). Until a status of PASSED or PASSED_WITH_DECLARED_LIMITS exists, no candidate is
      PR-eligible and a sealed ACCEPT is labelled uncalibrated.
    iteration_3_result_2026_10_27: >
      229 live qwen3-next calls (commits fc6be6c..fdc9b83), gate STILL FAILS: false-reject 1/3 first
      pass, 7/12 over all draws; stability 6/8=0.75 (target 0.90). Real progress, not noise: tier-1
      pipeline coverage now 0.90+ on every class the deterministic stage can decide (version, package,
      format, install, content loss, invented API, repeated paragraph), and the two LLM-only classes the
      prompt/scope work targeted went from 0.00/0.25 to 11/11 each (injected unsupported claim,
      promotional filler). Real unsupported claim and real contradiction stay at 0/2 and 1/2 -- too few
      samples to judge, not proven failures.
    decision_pause_live_iteration_2026_10_27: >
      SUPERVISOR DECISION: three iterations (165+121+229=515 live calls) have now failed the SAME two
      gates (false-reject, stability) in a row -- mission section 12's own rule ("two equivalent
      failures ... trigger supervisor diagnosis and a changed causal approach, not more repetitions")
      applies. The causal diagnosis is already named by iteration 3 itself: only 3 scored clean twins
      and 2 real-defect samples exist; no further prompt/scope tuning against that small, mostly-
      synthetic set is a credible next step. CHANGED APPROACH: stop spending live calibration calls for
      now; run the COHORT_FIRST_GUARD pilot (both lanes, one repository per ecosystem) instead, which
      serves two goals at once -- the mission's own portfolio-first requirement, and a real supply of
      fresh hosted candidates (more clean twins, more real defects) for calibration iteration 4. Status
      stays NOT_PASSED; data/reviewer_calibration.json is unchanged; no candidate is PR-eligible; a
      sealed ACCEPT stays labelled uncalibrated. Iteration 4 is reopened once the cohort yields at least
      3 more real, independently-verified bases.
    iteration_3_authorised: sectionwise review (bounded packets), deterministic claim checks, renderer-owned scope for unsupported_claim, merged duplicate findings, whole-section citations; budget 300 calls, cap 350, stated before spending (sectionwise multiplies calls but cuts tokens per call to about one sixth).
    calibration_budget_ledger: iteration 1 spent 165 of a 250 cap; iteration 2 (after the four fixes) authorised at 150, cap 200 -- stated before spending, recorded here.
    invariant_added_2026_10_27: no re-roll -- a blocking verdict on given candidate bytes is never overturned by a fresh, cache-bypassed review of the SAME bytes (measured stability is 0.20, so resampling until ACCEPT would be exactly the quiet demotion the mission forbids). Replay from the call store is the only second look at identical bytes.
    done_when: plan section 3 D10 -- V1..V7 pass and verdict v2 is sealed in bundles.
    reopening_rule: only a prompt, model route or a new clearance (failing test first); never a rule loosened without a proven false positive and a negative control.

