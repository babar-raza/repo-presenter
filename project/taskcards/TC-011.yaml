id: TC-011
gate: GATE3_PORTFOLIO
track: portfolio-delivery
purpose: >
  Reach P1: at least 25 common, authorized repository identities with BOTH lanes pipeline-good
  under a calibration-passing reviewer, each with a reproducible acceptance receipt, and one
  selected output per repository confirmed live upstream (state 10 of the eleven-state model in
  docs/RELEASE_CONTRACT_P1-P5.md) -- never a manufactured no-op PR. Blocked on calibration
  passing (TC-007) and a real publication path (TC-009); the current real count is 5 both-lanes
  pipeline-good and 0 live-delivered, against a target of 25. Depends on TC-009a (the real,
  live-write App-token milestone), not merely TC-009 (dev/mock scope) -- P1 needs genuine
  upstream delivery capability, not just a wired-and-tested mechanism (2026-11-04
  dependency-ordering correction).
depends_on:
  - TC-007
  - TC-009a
write_paths:
  - docs/RELEASE_CONTRACT_P1-P5.md
  - evidence/build/GATE3_PORTFOLIO/TC-011/**
satisfies:
  - REQ-P1-001
source_refs:
  - file: docs/RELEASE_CONTRACT_P1-P5.md
    anchor: "Gap to P1's 25-common-products target"
inputs: []
actions:
  - "Continue the fix-queue sweep toward common both-lane coverage, but only count a repository
     toward P1 once its candidate has cleared a calibration-passing reviewer."
  - "For each of the 25, obtain the owner's selected-output decision and confirm the live result
     against the real upstream repository, not the local durable record."
checks:
  # 2026-11-04 correction: a manually typed "LIVE_DELIVERY_CONFIRMED_COUNT: 25" marker is never
  # acceptable evidence for this goal -- an agent could simply type any number. This derives the
  # count from real, independently cross-validated sources: both-lane pipeline-good status from
  # the durable state backend, a globally-PASSED calibration record, and a real delivery-ledger
  # entry per repository (evidence/delivery_ledger.json -- does not exist yet, so today's
  # correct count is honestly 0, not a shortcut).
  - command: |-
      python ops/checks/portfolio_delivery_count.py 25
    expect: exit 0
    timeout_seconds: 300
    proves:
      - REQ-P1-001
requires:
  - python
network: true
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('evidence/delivery_ledger.json'); p.write_text('[]', encoding='utf-8')"
  rationale: >
    Once a real ledger with >=25 live-verified entries exists, this empties it -- a meaningful
    falsification of the actual cross-validated evidence, not a marker duplication. Before a
    real ledger exists, the clean run already correctly fails on calibration status alone and
    the negative control is skipped.
evidence:
  - project/state.yaml
closeout:
  - "This card's ACCEPTED state must be independently cross-checked against gh api for each of
     the 25 repositories' live README content, not accepted from a durable-state record alone."
recovery: "The named marker does not exist yet; this card is correctly not started."
