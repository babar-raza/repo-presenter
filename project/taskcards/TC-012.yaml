id: TC-012
gate: GATE4_PRODUCTION
track: production-cutover
purpose: >
  Reach P4/G6: unattended scheduled execution on GitHub-hosted runners and local Docker
  validation at the smallest credible scope. 2026-11-04 dependency-ordering correction: this no
  longer depends on TC-011 (25-product portfolio delivery) -- the directive explicitly flags
  "makes hosted scheduling depend on 25-product delivery, creating avoidable manual work."
  Scheduling and Docker validation are an infrastructure milestone independent of portfolio
  scale; the FINAL legacy-writer cutover (which genuinely should wait for real delivery proof)
  is now its own card, TC-012a. Still depends on writer disposition (TC-002, since a schedule
  could eventually also drive writes), preflight (TC-008, so scheduled runs don't burn needless
  provider calls), and the dev-scope issues lifecycle (TC-010).
depends_on:
  - TC-002
  - TC-008
  - TC-010
write_paths:
  - .github/workflows/present.yml
  - Dockerfile
satisfies:
  - REQ-G6-001
source_refs:
  - file: docs/AUDIT_2026-11-01_FIRST_PRINCIPLES_EVALUATION.md
    anchor: "G6 -- Autonomous Docker + GitHub Actions production"
inputs: []
actions:
  - "Add a schedule: trigger to present.yml, with bounded retry/recovery, budget and kill
     switches."
  - "Add the smallest credible Dockerfile that isolates untrusted upstream example code from
     long-lived infrastructure credentials, per the existing two-job trust boundary."
  - "Record the owner-approved legacy-writer cutover/retirement in
     docs/LEGACY_CUTOVER_RECORD.md -- never a silent pause."
checks:
  - command: |-
      python ops/checks/marker_check.py .github/workflows/present.yml "schedule:"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G6-001
  - command: |-
      python ops/checks/marker_check.py Dockerfile "FROM"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G6-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('.github/workflows/present.yml'); s = p.read_text(encoding='utf-8'); s2 = s.replace('schedule:', 'removed:'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Removes the schedule trigger once it exists. Proves the check tracks real autonomy, not a
    comment merely mentioning the word "schedule."
evidence:
  - .github/workflows/present.yml
  - Dockerfile
closeout:
  - "Run at least one real unattended cycle and independently confirm its outcome before this
     card is ACCEPTED. TC-012a, not this card, covers the final legacy-writer cutover."
recovery: "None of the named artifacts exist yet; this card is correctly not started."
