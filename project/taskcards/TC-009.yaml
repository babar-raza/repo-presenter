id: TC-009
gate: GATE2_INTEGRATIONS
track: github-app
purpose: >
  DEV/MOCK SCOPE ONLY (2026-11-04 dependency-ordering correction: isolated implementation,
  read-only inspection, and mock-token testing do not need owner authorization -- only an actual
  external write does, per the directive's own §6). Reuse the legacy repository's proven
  actions/create-github-app-token@v2 pattern for App installation tokens, per P3 -- do not
  implement custom JWT signing or a new credential service unless a specific, verified
  requirement proves the proven hosted mechanism insufficient. Wire the workflow step and verify
  it locally against a mock/test token; TC-009a (separate card) covers minting one real
  installation token against the real App, which is genuinely gated on TC-002.
depends_on: []
write_paths:
  - .github/workflows/present.yml
  - docs/DECISION_LOG.md
  - src/repo_presenter/github/**
  - tests/github/**
satisfies:
  - REQ-G5-001
source_refs:
  - file: docs/repo_presenter_independent_audit_2026-11-03.md
    anchor: "Prefer hosted Action mints scoped installation token"
inputs: []
actions:
  - "Record the reuse-over-rebuild decision in docs/DECISION_LOG.md."
  - "Adapt actions/create-github-app-token@v2 into present.yml's write-capable job, scoped and
     short-lived, with the existing token_provenance.py verifying it end to end."
checks:
  - command: |-
      python ops/checks/marker_check.py docs/DECISION_LOG.md "APP_TOKEN_REUSE_DECISION:"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G5-001
  - command: |-
      python ops/checks/marker_check.py .github/workflows/present.yml "create-github-app-token"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G5-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('docs/DECISION_LOG.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('APP_TOKEN_REUSE_DECISION:', 'removed'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Deletes the decision marker. Proves the check reads real content; the second check (the
    workflow file) independently proves the decision was actually wired, not just recorded.
evidence:
  - docs/DECISION_LOG.md
  - .github/workflows/present.yml
closeout:
  - "This card closes on the workflow wiring + a passing mock-token test. The live mint is
     TC-009a, not this card -- do not fire a real token mint under this card's scope."
recovery: "Revert the present.yml wiring; the decision record in docs/DECISION_LOG.md stays as a
  historical entry even if the implementation is rolled back."
