    python -c "import pathlib; p = pathlib.Path('docs/SOURCE_OF_TRUTH_2026-11-04.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('RECONCILIATION_STATUS: RESOLVED', ''); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Deletes the resolution marker the check requires. Proves the check reads the file's real
    content rather than only confirming the file exists.
evidence:
  - docs/SOURCE_OF_TRUTH_2026-11-04.md
closeout:
  - "git push origin main"
recovery: "Revert the commit touching docs/SOURCE_OF_TRUTH_2026-11-04.md only; no product code involved."
