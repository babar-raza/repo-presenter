id: TC-010
gate: GATE2_INTEGRATIONS
track: issues-lifecycle
purpose: >
  DEV/MOCK SCOPE ONLY (2026-11-04 dependency-ordering correction, directive §6/§7). Build and
  test the complete issues lifecycle (P2) against a local/mock token: discovery,
  classification, dedup, approval, filing, assignment, tracking, re-detection, verified
  resolution, authorized closing -- not just the single filing path that exists today. Reuse
  the legacy repo's tested discovery/redetect/close_approval/lifecycle/funnel modules rather
  than rebuilding from scratch. TC-010a (separate card) covers firing this for real against a
  live upstream repository, which genuinely needs TC-002 first.
depends_on: []
write_paths:
  - src/repo_presenter/issues/**
  - tests/issues/**
satisfies:
  - REQ-G3-001
source_refs:
  - file: docs/AUDIT_2026-11-01_FIRST_PRINCIPLES_EVALUATION.md
    anchor: "G3 -- Issues module operational"
inputs: []
actions:
  - "Port the legacy repo's discovery and close/redetect modules, adapted to this repo's current
     schema, preserving owner-approval gating and safe rate limits."
  - "Give the whole lifecycle one real, independently-confirmed caller."
checks:
  - command: |-
      python ops/checks/marker_check.py src/repo_presenter/issues/discovery.py "class HandoffDiscovery"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G3-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('src/repo_presenter/issues/discovery.py'); p.write_text('placeholder', encoding='utf-8') if p.exists() else None"
  rationale: >
    If the discovery module ever exists, replacing it with a placeholder must make this check
    fail -- the check must track real content, not merely file presence.
evidence:
  - src/repo_presenter/issues/discovery.py
closeout:
  - "Demonstrate discover -> dedupe -> approval -> file -> track -> re-detect -> resolve -> close
     once end to end against a mock/local token, independently confirmed. TC-010a, not this
     card, covers the real upstream exercise."
recovery: "The named module does not exist yet; this card is correctly not started."
