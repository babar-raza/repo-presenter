id: TC-005
gate: GATE0_AUTHORITY
track: governance
purpose: >
  Freeze the P1-P5 release contract (mapped to G1-G8, with the eleven-state distinction) and
  close the stale-portfolio-dashboard pattern with real closure teeth: project/state.yaml's
  top-of-file lane_r_accepted/lane_l_accepted counters must match a fresh
  scripts/portfolio_status.py run, and this card's own check keeps proving that match rather than
  trusting that a past sync is still current.
depends_on: []
write_paths:
  - tests/ops/test_gate_guard_tc005.py
satisfies:
  - REQ-G8-013
source_refs:
  - file: docs/AUDIT_2026-11-01_FIRST_PRINCIPLES_EVALUATION.md
    anchor: "Eight-Goal Scorecard"
inputs: []
actions:
  - "Write docs/RELEASE_CONTRACT_P1-P5.md with the P1-P5/G1-G8 mapping and the eleven-state list."
  - "Run python scripts/portfolio_status.py and resync project/state.yaml's dashboard counters to
     its exact output."
checks:
  - command: |-
      python ops/checks/marker_check.py docs/RELEASE_CONTRACT_P1-P5.md "RELEASE_CONTRACT_ADOPTED_2026-11-04"
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G8-013
  # 2026-11-04 correction: hard-coded "10"/"12" would wrongly FAIL the moment a legitimate new
  # hosted run raises either number (to 11/13, say), and would wrongly PASS forever if the
  # numbers simply stopped being updated -- exactly the staleness this card exists to prevent.
  # This check instead runs scripts/portfolio_status.py's own underlying machinery fresh, every
  # time, and compares it against whatever project/state.yaml currently records -- needs network
  # (the durable state backend's refs live on origin).
  - command: |-
      python ops/checks/dashboard_matches_live.py
    expect: exit 0
    # 2026-11-11: 300s was too tight now that the portfolio has grown (36 repos x 2 lanes, each
    # zero-call re-certified) -- measured 735s real on a clean run. Widened with margin rather
    # than re-tightened, since this only grows as more repositories seal.
    timeout_seconds: 1200
    proves:
      - REQ-G8-013
  - command: |-
      python -m pytest tests/ops/test_gate_guard_tc005.py -q
    expect: exit 0
    # 2026-11-06: 60 s was too tight. The test runs the live portfolio status, which queries origin
    # over the network (measured 37 s and >60 s on two consecutive runs): a timeout, not a code flake.
    # 2026-11-11: 240s was too tight for the same reason as the check above -- measured 718s real.
    timeout_seconds: 1200
    proves:
      - REQ-G8-013
requires:
  - python
network: true
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('project/state.yaml'); s = p.read_text(encoding='utf-8'); s2 = s.replace('lane_r_accepted: 10', 'lane_r_accepted: 999'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Replaces today's known-current recorded value with an implausible sentinel (999) that can
    never coincidentally match whatever the live script actually reports -- a real falsification
    of today's content, without regex or backslashes crossing the YAML/shell boundary (the exact
    shape ops/SUPERVISOR.md's own falsifier-authoring rule warns against). As the real recorded
    number changes over time, this mutate line will stop matching and should be refreshed to the
    then-current value the same way any negative control is maintained alongside its card.
evidence:
  - docs/RELEASE_CONTRACT_P1-P5.md
  - project/state.yaml
closeout:
  - "Re-run python scripts/portfolio_status.py and this card's checks any time a lane record
     changes -- do not let the top-of-file dashboard drift a fourth time."
recovery: "Revert the docs/RELEASE_CONTRACT_P1-P5.md and project/state.yaml counter edits only."
