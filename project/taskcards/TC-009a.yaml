id: TC-009a
gate: GATE2_INTEGRATIONS
track: github-app
purpose: >
  LIVE-WRITE MILESTONE, split out from TC-009's dev/mock scope (2026-11-04 dependency-ordering
  correction, directive §7: "Critical integration cards have incomplete write_paths" /
  TC-009/TC-010 "unnecessarily blocked for development"). Mint one real App installation token
  against the real `repository-presenter` App and verify it end to end via the existing
  `token_provenance.py`. This genuinely requires TC-002's owner-approved writer disposition
  first, because it is a second live write path toward the same upstream App installation the
  legacy system already holds -- that gating is correct here, unlike at TC-009's dev stage.
depends_on:
  - TC-002
  - TC-009
requires_owner_decision: true
write_paths:
  - docs/DECISION_LOG.md
  - evidence/build/GATE2_INTEGRATIONS/TC-009a/**
satisfies:
  - REQ-G5-001
source_refs:
  - file: project/taskcards/TC-009.yaml
    anchor: "TC-009a covers minting one real installation token"
inputs: []
actions:
  - "Obtain the owner's named, scoped authorization for this specific first live mint."
  - "Mint one real installation token via the wired Actions step; verify it with
     token_provenance.py; record the result (not the token itself) in docs/DECISION_LOG.md."
  - "Write evidence/build/GATE2_INTEGRATIONS/TC-009a/mint_proof.json with minted=true,
     verified_via_token_provenance=true, and the real timestamp -- only the actual mint/verify
     code path may write this file, never the authorization step."
checks:
  # 2026-11-04 (follow-up directive §6): AUTHORIZED != EXECUTED. This check alone only proves a
  # human wrote an authorization record -- it cannot and must not be mistaken for proof the
  # mint actually happened. The second check below is independent, required evidence that the
  # authorized action was actually carried out.
  - command: |-
      python ops/checks/owner_decision_record.py docs/DECISION_LOG.md APP_TOKEN_LIVE_MINT_AUTHORIZED:
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G5-001
  - command: |-
      python ops/checks/execution_proof.py evidence/build/GATE2_INTEGRATIONS/TC-009a/mint_proof.json minted=True verified_via_token_provenance=True
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G5-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('docs/DECISION_LOG.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('ref=', 'ref=BROKEN-'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Same cross-reference-corruption pattern as TC-002/TC-004: once a real authorization record
    exists, this breaks its reference to a real decision-log entry rather than duplicating a
    marker. Before a real record exists, the clean run already correctly fails.
evidence:
  - docs/DECISION_LOG.md
  - evidence/build/GATE2_INTEGRATIONS/TC-009a/mint_proof.json
closeout:
  - "The minted token itself must never be committed or logged in plaintext -- only the fact and
     outcome of the mint/verify cycle, in mint_proof.json."
recovery: "No live token has been minted; nothing external to revert."
