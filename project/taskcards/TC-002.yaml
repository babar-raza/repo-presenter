id: TC-002
gate: GATE0_AUTHORITY
track: legacy-reconciliation
purpose: >
  Inventory every write-capable legacy (repository-presenter) workflow and effect, with real
  job-level evidence of whether a write has actually occurred (not just "workflow enabled"),
  and obtain an explicit owner-approved disposition per writer before any new LIVE-WRITE
  publishing/issues action (TC-009a, TC-010a, TC-012a -- the final cutover) proceeds against the
  same upstream App installation. This card stays correctly BLOCKED until the owner actually
  signs off on a BLANKET disposition -- it must not be gamed into ACCEPTED by weakening its own
  check. 2026-11-04 (second supervisor directive, section 2): the owner has separately given an
  explicit INTERIM disposition -- preserve the legacy writer and its existing authorization
  exactly as-is; keep read-only monitoring/liveness operational; preserve existing issues/PRs/
  approvals/records/history; never run two autonomous writers for the same (repository, effect);
  build and test replacement implementations (TC-009/TC-010's dev/mock scope, already done)
  without waiting on this card; for any live pilot, obtain the applicable authorization for that
  EXACT target/effect and isolate ownership so old and new systems never compete; never retire,
  disable, overwrite, or force-push the legacy system; final writer-ownership migration remains
  its own distinct, later, owner-approved cutover (TC-012a). This is recorded in
  docs/DECISION_LOG.md. It is explicitly NOT a blanket OWNER_APPROVED_WRITER_DISPOSITION -- this
  card's own check must not be satisfied by it, and was not; TC-009/TC-010's dev/mock scope was
  never actually blocked on this card in the real dependency graph (depends_on: [] on both),
  only TC-009a/TC-010a/TC-012a (the live-write/cutover cards) correctly still are.
depends_on: []
write_paths:
  - docs/LEGACY_WRITER_INVENTORY_2026-11-04.md
satisfies:
  - REQ-P3-001
requires_owner_decision: true
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: "2026-10-24: The old repo's P3/P4"
inputs: []
actions:
  - "Classify every legacy workflow READ-ONLY vs WRITE-CAPABLE from its own permissions: block."
  - "Check the most recent write-capable job's actual step-level log, not just run conclusion."
  - "Search for real bot-authored PRs/issues across every target org."
  - "Propose a disposition per writer; do NOT write an owner-approval marker -- that is the
     owner's decision, not this card's to fabricate."
checks:
  # 2026-11-04 correction: the first version's check accepted a bare marker string, and its
  # negative control appended that same marker -- which cannot falsify a legitimate positive
  # state (appending more of a string that already satisfies a substring check changes nothing).
  # This version requires a structured, cross-referenced record: "<PREFIX> <YYYY-MM-DD>
  # ref=<anchor>", where <anchor> must independently resolve to real text in
  # docs/DECISION_LOG.md. No mechanical check can prove a human actually decided something; this
  # raises the bar from "one string anywhere" to "a dated record pointing at a real decision-log
  # entry," which a meaningful negative control can actually break (see below).
  - command: |-
      python ops/checks/owner_decision_record.py docs/LEGACY_WRITER_INVENTORY_2026-11-04.md OWNER_APPROVED_WRITER_DISPOSITION:
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-P3-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('docs/LEGACY_WRITER_INVENTORY_2026-11-04.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('ref=', 'ref=BROKEN-'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Once a real record exists ("OWNER_APPROVED_WRITER_DISPOSITION: <date> ref=<anchor>"), this
    corrupts the cross-reference itself (ref=BROKEN-<anchor> will not match any real
    docs/DECISION_LOG.md text) rather than duplicating a marker -- a meaningful falsification of
    the actual positive state, not a no-op. Before a real record exists, this mutate has nothing
    to corrupt and the clean run already correctly fails, so the negative control is skipped
    (do_verify's own documented behavior) -- expected and correct at this stage.
evidence:
  - docs/LEGACY_WRITER_INVENTORY_2026-11-04.md
closeout:
  - "Do not mark this card ACCEPTED from the automated check alone -- require a dated
     docs/DECISION_LOG.md entry naming the owner's actual disposition decision."
recovery: "Revert the commit touching docs/LEGACY_WRITER_INVENTORY_2026-11-04.md only."
