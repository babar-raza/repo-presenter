id: TC-004
gate: GATE0_AUTHORITY
track: governance
purpose: >
  Obtain an explicit owner ruling on a real, confirmed governance violation: the 2026-10-31
  decision log paused broad coverage sweeps until the three-repository pilot set reached parity
  with aspose.org (decision 4), and that pause was never lifted on the record -- yet the sweep
  that raised Lane R from 4 to 9-10 and Lane L from 4 to 12 (2026-11-01 onward) proceeded anyway,
  with no decision-log entry authorizing the resumption. This card stays BLOCKED until the owner
  rules on it; it must not be closed by an agent's own interpretation. 2026-11-04 (second
  supervisor directive, section 2): the owner has separately UPHELD the original conditional
  pause exactly as written, with its existing, objective lift condition (the three-product
  pilot set reaching the established quality bar) -- not lifted. Explicitly still allowed under
  this ruling: read-only investigation/comparison, implementing and testing shared corrections,
  named bounded pilot verification (at most three repositories per change), building calibration
  harnesses. Explicitly still prohibited: broad portfolio generation sweeps, treating
  historically produced candidates as newly verified, upstream writes without specific
  authorization. This is recorded in docs/DECISION_LOG.md. It is explicitly NOT an
  OWNER_RULING_SWEEP_PAUSE: LIFTED record -- this card's own check, and
  scheduled_execution_gate.py's own sweep-pause predicate, must not be satisfied by it, and were
  not: the pause itself continues exactly as the 2026-10-31 decision already set it.
depends_on: []
write_paths:
  - docs/DECISION_LOG.md
  - docs/READINESS_PACKAGE_2026-11-04.md
satisfies:
  - REQ-G8-012
requires_owner_decision: true
source_refs:
  - file: docs/DECISION_LOG.md
    anchor: "2026-10-31: Owner delegates the open decisions and sets the target"
inputs: []
actions:
  - "State the violation plainly, with exact citations, in docs/READINESS_PACKAGE_2026-11-04.md."
  - "Propose a safe default (do not discard the already-produced pipeline-good candidates; do not
     resume further broad sweeps; require any candidate from the paused window to clear a
     calibration-passing reviewer before counting toward P1 eligibility) without presuming the
     owner's actual ruling."
  - "Await and record the owner's explicit decision as a dated docs/DECISION_LOG.md entry
     containing the OWNER_RULING_SWEEP_PAUSE marker."
checks:
  # 2026-11-04 correction, same reasoning as TC-002: require a dated record that cross-
  # references a real anchor (here, the 2026-10-31 entry this ruling is actually about), not a
  # bare marker a negative control could only duplicate, never falsify.
  - command: |-
      python ops/checks/owner_decision_record.py docs/DECISION_LOG.md OWNER_RULING_SWEEP_PAUSE:
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G8-012
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('docs/DECISION_LOG.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('ref=', 'ref=BROKEN-'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Once a real ruling exists ("OWNER_RULING_SWEEP_PAUSE: <date> ref=<anchor-of-the-2026-10-31-
    entry-being-ruled-on>"), this corrupts the cross-reference so it resolves to nothing real --
    a meaningful falsification, not a marker duplication. Before a real ruling exists, the clean
    run already correctly fails and the negative control is skipped, per do_verify's own
    documented behavior.
evidence:
  - docs/READINESS_PACKAGE_2026-11-04.md
closeout:
  - "Do not mark ACCEPTED without a human-reviewed, dated docs/DECISION_LOG.md entry recording
     the owner's actual ruling."
recovery: "No files are mutated by this card until the owner rules; nothing to revert."
