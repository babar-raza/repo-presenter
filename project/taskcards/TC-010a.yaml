id: TC-010a
gate: GATE2_INTEGRATIONS
track: issues-lifecycle
executor: supervisor
purpose: >
  LIVE-WRITE MILESTONE, split out from TC-010's dev/mock scope (2026-11-04 dependency-ordering
  correction). Exercise the complete issues lifecycle once, for real, against one real,
  owner-named upstream repository -- genuinely gated on TC-002 because this touches the same
  upstream issue surface the legacy funnel already owns (per the corrected, more precise
  classification in docs/LEGACY_WRITER_INVENTORY_2026-11-04.md: globally armed, per-repository
  gated).
depends_on:
  - TC-002
  - TC-010
requires_owner_decision: true
write_paths:
  - docs/DECISION_LOG.md
  - evidence/build/GATE2_INTEGRATIONS/TC-010a/**
satisfies:
  - REQ-G3-001
source_refs:
  - file: project/taskcards/TC-010.yaml
    anchor: "TC-010a (separate card) covers firing this for real"
inputs: []
actions:
  - "Obtain the owner's named, scoped authorization for one specific target repository and
     defect."
  - "Run discover -> dedupe -> approval -> file -> track -> re-detect -> resolve -> close for
     real against that target; record the outcome independently confirmed via gh api."
checks:
  # 2026-11-04 (follow-up directive §6): AUTHORIZED != EXECUTED. Second, independent check that
  # the lifecycle actually ran and reached a real outcome, not merely that it was authorized.
  - command: |-
      python ops/checks/owner_decision_record.py docs/DECISION_LOG.md ISSUES_LIVE_LIFECYCLE_AUTHORIZED:
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G3-001
  - command: |-
      python ops/checks/execution_proof.py evidence/build/GATE2_INTEGRATIONS/TC-010a/lifecycle_proof.json filed=True resolved_or_closed=True independently_confirmed_via_gh_api=True
    expect: exit 0
    timeout_seconds: 30
    proves:
      - REQ-G3-001
requires:
  - python
network: false
negative_control:
  mutate: |-
    python -c "import pathlib; p = pathlib.Path('docs/DECISION_LOG.md'); s = p.read_text(encoding='utf-8'); s2 = s.replace('ref=', 'ref=BROKEN-'); p.write_text(s2, encoding='utf-8')"
  rationale: >
    Same cross-reference-corruption pattern as TC-002/TC-004/TC-009a.
evidence:
  - docs/DECISION_LOG.md
  - evidence/build/GATE2_INTEGRATIONS/TC-010a/lifecycle_proof.json
closeout:
  - "Independently confirm the real close/resolution via gh api against the actual upstream
     issue, not the local durable record alone -- write that confirmation into
     lifecycle_proof.json, never fabricate independently_confirmed_via_gh_api."
recovery: "No live issue action has been taken; nothing external to revert."
