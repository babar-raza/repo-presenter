  - component: "foss-mcp ops/ supervisor mechanics"
    source: foss-mcp
    disposition: ADAPT
    reason: >
      See the dedicated adaptation plan this repo's P0 pass produced (fork
      report, 2026-10-21): gatecli.py is the business-logic half (despite the
      smaller-sounding name), gatectl.py the shared-utility half; gateverify.py
      is the acceptance engine (run_checks/do_verify/rebuild_state); cardlint.py
      and secretscan.py are general-purpose and portable near-verbatim;
      integrate.py is a sound atomic-cherry-pick pattern to port once a second
      taskcard exists. foss-mcp-specific: the taskcard `lane` enum (collides
      conceptually with this project's own Lane L/R — must not reuse the same
      field name), the `gate` id pattern (^G[0-5]$), release.py (Docker image
      bookkeeping, irrelevant here), and the hardcoded foss-mcp repo path.
    target_module: ops/ (this repository)
    smallest_first_integration_test: >
      Port schemas/taskcard.schema.json + receipt.schema.json + state.schema.json
      (with lane/gate fields adapted), then validate/state/commit-guard/instruct/
      status-append/verify/review commands sufficient for one taskcard's full
      tick→dispatch→worker-commit→review→accept loop.
    portfolio_consumers: every future taskcard in this repository.

