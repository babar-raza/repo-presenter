entries:
  - component: "components/readme/review/independent/review.py (reviewer verdict-fold logic)"
    source: old-repository-presenter
    evaluated_at_shas: [cc6da3681226, fa04bc96ef6f, e482390bde59e77]
    behavior: >
      Independent non-authoring reviewer that returns a verdict; a demotion rule
      folds REJECT findings into advisory annotations under conditions.
    evidence: docs/history-reconstruction.md "The acceptance-integrity bug, in detail"
    known_defect: >
      Pre-2026-10-10: folded REJECT to ACCEPT whenever a finding's quoted span
      matched a literal SUPPORTED fact value, regardless of the finding's actual
      merit (confirmed: 27 of 30 sealed reviews affected). Fixed 2026-10-10
      (e482390bde59e77) by splitting DETERMINISTIC_RULES (may refute with
      refuted_by{rule,evidence}) from JUDGMENT_RULES (annotate only, never fold).
    first_observed_working: never — the post-fix version has not been exercised
      end to end against a real candidate as of 2026-10-21.
    licensing: proprietary, same owner (babar-raza) — no restriction beyond normal
      private-repo reuse by the same owner.
    disposition: "ADD, not ADAPT (corrected 2026-10-24): the rule-split *pattern* was carried
      forward as designed, but zero lines of the old review.py/judge.py were ported -- both are
      disqualified from REUSE by their dependence on a sealed bundle/manifest layout
      (core/candidates.py) and a repair loop (repair/rounds.py) this repository does not have.
      Built from scratch, from this entry's own pattern description, against this repository's
      own evidence shapes."
    reason: >
      The deterministic/judgment rule-split *pattern* is sound design and worth
      re-implementing; the code itself is unproven post-fix and the component's
      sibling (the Lane L validation chain) has an independently-confirmed blind
      spot (Oct 20 findings: 71/366 contradicted examples passed its gates). Do
      not REUSE verbatim; write this repo's own reviewer against the pattern,
      verified fresh in P1.
    target_module: "src/repo_presenter/readme/review/independent_reviewer.py -- BUILT 2026-10-24
      (project/state.yaml BUILD_INDEPENDENT_REVIEWER). v1 scope: two deterministic rules only
      (claim_contradiction via validation/claims.py, duplicate_opening_paragraph via
      authoring.preserved_opening_text + coverage.states_all); no judgment rules registered yet
      (the extension point exists and is structurally safe -- Finding.__post_init__ raises if a
      judgment-kind finding ever carries a refutation); no forest-acceptance breadth yet (mission
      P2 activity, deliberately deferred past this P1-style first proof). Repair hand-off: DONE
      2026-10-24 (project/state.yaml BUILD_DEFECT_BRIDGE_2026_10_24) -- added Finding.quote and
      src/repo_presenter/readme/review/defect_bridge.py, bridging a ReviewVerdict's deterministic
      REJECT findings into readme/repair/targeted.py::review_defects (routes a finding over
      inherited/placed content to S4, never S6 -- confirmed necessary by this reviewer's own
      first real finding, aspose-font-foss/Python, which was exactly such a case). No repair LOOP
      exists yet to fire a job from the Defects this produces -- that remains genuinely deferred.
      The veto is wired live into propose/effect.py's
      propose_candidate (a required `review` parameter, no override path) -- the one real
      effect-firing site that exists, so 'can veto' is an enforced property, not an unread file."
    smallest_first_integration_test: >
      Feed the reviewer a candidate with one deliberately false claim whose
      quoted span happens to also match a literal SUPPORTED fact elsewhere in
      the candidate; assert the verdict is REJECT, not ACCEPT (this is the
      exact negative control the old bug would have failed). PASSES as of
      2026-10-24: tests/readme/review/test_independent_reviewer.py::
      test_falsifier_a_quoted_span_matching_a_supported_fact_elsewhere_still_rejects.
    portfolio_consumers: >
      Both lanes, every candidate -- this is the acceptance gate. As of 2026-10-24 it has been
      run against the P2_REAL_ENGINE_SALVAGE cohort (RUN_INDEPENDENT_REVIEW_P2_COHORT_2026_10_24,
      project/state.yaml) -- 30/34 reviewable, 1 genuine REJECT found and hand-verified. The
      separate, original P1_PORTFOLIO_SCALE 36-repository sweep remains unreviewed (incompatible
      facts.json schema; see that card's p1_cohort_attempt_2026_10_24). Owner correction on
      record (project/state.yaml owner_review_status, 2026-10-24): none of either cohort's
      candidates carry owner acceptance regardless of this reviewer's verdicts.
    invalidation_impact: >
      Built 2026-10-24. Running it against the existing 36 Lane L / 34 Lane R candidates is a
      first-ever independent review pass, not a reseal (mission §8 "consumed-scope invalidation
      only"): no independent reviewer existed before this build (SALVAGE_INVENTORY_2026_10_23
      confirmed zero review/judge/acceptance code in this repository), so no candidate's prior
      pipeline-level pass is being reopened by this module's own existence -- a REJECT it finds
      against one candidate is a new finding against that one candidate only.

