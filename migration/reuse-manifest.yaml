  - component: "readme_correction/ (Lane L engine: model.py, engine.py, apply.py, 8 self-contained detectors, chain.py+verify.py sandboxed build/test runner)"
    source: old-repository-presenter
    evaluated_at_shas: []
    behavior: >
      Deterministic correction pipeline: Context (README text + FactsDocument) ->
      engine.collect() runs auto-discovered Detector functions -> Edit objects
      (6 closed kinds, shape-validated in __post_init__ so an out-of-bounds edit
      cannot be constructed) -> apply.apply_edits() pure substring splice ->
      apply.confinement_violations() proves every byte outside edit spans is
      untouched -> engine.is_stable() proves determinism+idempotency by actually
      re-running correction and comparing bytes. chain.py+verify.py is a real
      sandboxed (host-first, Docker-fallback across 6+ toolchains) build/test
      runner backing the add_dev_commands detector.
    evidence: >
      Read-only research pass 2026-10-21 (fork report, full file reads of
      model.py/engine.py/apply.py/all detectors/chain.py/verify.py). See
      docs/history-reconstruction.md for citation; full report not re-filed here.
    disposition: ADAPT (REUSE for apply.py specifically)
    reason: >
      model.py/engine.py: ADAPT — sound confinement-proof architecture, needs
      Fact/FactsDocument dependency resolved against src/repo_presenter/core/facts.py
      (now ported, same shape). apply.py: REUSE — 87 lines, zero dependencies
      beyond model.Edit. 8 detectors (links/examples/gaps/structure/sections/
      stale/diagram/additions): ADAPT — self-contained over Context/Fact, no
      old-repo entanglement found. claims.py/statements.py detectors: ADAPT,
      but pull the shared BC-14 claim-recognizer logic they depend on too, not
      duplicate it. chain.py+verify.py: ADAPT, high value — the single most
      sophisticated asset found in this component; heavier dependency surface
      (core/git_safety, core/toolchains, core/secrets) but worth the pull.
    target_module: src/repo_presenter/readme/correction/ (planned)
    smallest_first_integration_test: >
      Port model.py + apply.py + engine.py first with one detector (broken_link,
      the simplest), prove confinement_violations() catches a deliberately
      out-of-span edit (the exact negative control this architecture is built for).
    portfolio_consumers: Lane L, every candidate.
    invalidation_impact: not yet pulled.
    known_gap: >
      No detector here checks format/capability OVER-claiming (README claims a
      format works but the dispatch/registration code doesn't wire it up — the
      3D-.NET U3D/RVM/AMF/HTML5 case and the original 3D-Python OBJ-export case).
      report_gaps only catches UNDER-claiming. A new detector is needed, not
      salvageable from this component. Also: no detector AUTO-FIXES the
      Enterprise Edition naming violation (BC-06 in the old repo's validation/
      layer only REJECTS it) — a new, small FALSE_CLAIM_FIX-kind detector is
      needed here, informed by this session's own 3-repo finding.

