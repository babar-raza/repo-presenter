      Done 2026-10-21: ported model.py + apply.py + engine.py with one detector
      (broken_link) first, then the other 3 self-contained detectors and the 2
      new ones; confirmed confinement_violations() catches a deliberately
      out-of-span edit two ways -- a forged span whose quoted `original` the
      real document does not hold at that offset ("quotes text the original
      lacks"), and a single-line, shape-valid edit whose span runs past the
      document's own length ("overlaps or leaves the text") -- both run live
      (not just asserted in pytest) and both rejected, exactly the negative
      control this architecture is built for.
