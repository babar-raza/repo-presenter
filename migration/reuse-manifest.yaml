      a CONTRADICTED-fact case, and two negative controls (a correctly-
      caveated row, and a row a SUPPORTED fact actually backs). Stated
      limitation: only reads markdown table rows (the shape measured on the
      portfolio's own format-support tables), not free prose claims --
      broadening to prose is future work, not attempted, to avoid a regex
      fragile enough to itself over-claim what it detects.
      (2) Enterprise Edition naming: new detector
      detectors/enterprise_edition.py (FALSE_CLAIM_FIX-kind, auto-edits),
      generalized from the 3 real portfolio fixes this session made manually
      (evidence/build/P1_PORTFOLIO_SCALE/{aspose-slides-foss__Aspose.Slides-
      FOSS-for-Java,aspose-words-foss__Aspose.Words-FOSS-for-.NET,
      aspose-words-foss__Aspose.Words-FOSS-for-Python}/lane_l_candidate.diff).
      Auto-fixes only when the product name+platform is already spelled out on
      the same physical line (a markdown link, or plain text) AND a
      link_target:product.enterprise fact is on record to cite as the edit's
      evidence; a bare "the commercial product" with no name on its line, or a
      naming violation split across a hard line-wrap, is reported as a Finding
      instead of guessed -- 2 of the 5 real occurrences across those 3 diffs
      fall into this reported-not-guessed category, stated honestly rather
      than silently matched by inventing a product name from elsewhere in the
      document. "commercial" describing something other than the product's own
      name (e.g. "the commercial codebase") is correctly left untouched, per a
      real precedent in the .NET diff.

