      (core.autocrlf=false, core.eol=lf), disables interactive credential prompts at the source
      (GIT_TERMINAL_PROMPT=0, GCM_INTERACTIVE=never), and -- the one with a real documented
      incident behind it -- scrubs GIT_DIR/GIT_WORK_TREE/GIT_INDEX_FILE and five siblings from
      every child environment, because any one of them silently redirects a git command meant
      for the repository at cwd to some OTHER repository Git exports them for (measured
      2026-09-11 in the old repo: under a pre-push hook, a test suite's own fixtures
