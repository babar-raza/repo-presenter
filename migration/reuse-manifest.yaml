  - component: "readme_correction/ (Lane L engine: model.py, engine.py, apply.py, 8 self-contained detectors, chain.py+verify.py sandboxed build/test runner)"
    source: old-repository-presenter
    evaluated_at_shas: []
    behavior: >
      Deterministic correction pipeline: Context (README text + FactsDocument) ->
      engine.collect() runs auto-discovered Detector functions -> Edit objects
      (6 closed kinds, shape-validated in __post_init__ so an out-of-bounds edit
      cannot be constructed) -> apply.apply_edits() pure substring splice ->
      apply.confinement_violations() proves every byte outside edit spans is
