      (disposition_coverage on a kept code block, live_readme_loss on headings marked NON_CONTENT).
      Those findings have no repairable causal stage, so they stay blocking. Not evaluated against
      live candidates.
      Not done: S4 repair (needs reconciliation/patch.py), the BC-07 visible-line branch and
      validation_defects (need S9), judgment second reads (need a judgment rule), raw_calls and
      bundle seeding (need the bundle layer). No live repair run exists.
    portfolio_consumers: any Lane R candidate with a deterministic REJECT whose causal stage is S5 or S6.
    invalidation_impact: >
      None for accepted candidates: nothing has run it live. A repaired candidate changes only its
      own consumed stage and its downstream calls; no other candidate's store entries are touched.
    smallest_first_integration_test: "tests/readme/repair/test_loop.py::test_a_rejected_finding_is_repaired_once_through_run_job_and_the_cascade_is_settled"

